/* =======================================================================
   NUVEM — caderneta compartilhada
   Os dados são quebrados em fragmentos (capa, cada turma, cada avaliação,
   cada folha de notas). Só o fragmento alterado é enviado, então dois
   professores lançando ao mesmo tempo não se sobrescrevem.
   ======================================================================= */
const cadernetaVazia = (x)=>{ const o=x||DB;
  return !(o.turmas||[]).length && !(o.avaliacoes||[]).length && !(o.professores||[]).length; };
const CHAVE_NUVEM = 'caderneta_nuvem';
const CHAVE_SINC  = 'caderneta_sinc';
var NUVEM = { url:'', chave:'' };
var SINC  = { ultimo:null, enviados:{}, estado:'desligado', erro:'', em:null };
var timerSinc=null, sincronizando=false, jaBaixou=false;

const nuvemLigada = ()=> !!(NUVEM.url && NUVEM.chave);

function carregarNuvem(){
  try{
    const m = (location.hash||'').match(/[#&]n=([^&]+)/);
    if(m){
      const cfg = JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(m[1])))));
      if(cfg.u && cfg.k){
        NUVEM={url:cfg.u, chave:cfg.k};
        localStorage.setItem(CHAVE_NUVEM, JSON.stringify(NUVEM));
        try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){}
      }
    }
  }catch(e){}
  try{
    if(!nuvemLigada()){
      const c=JSON.parse(localStorage.getItem(CHAVE_NUVEM)||'null');
      if(c&&c.u) NUVEM={url:c.u, chave:c.k};
    }
    const s=JSON.parse(localStorage.getItem(CHAVE_SINC)||'null');
    if(s){ SINC.ultimo=s.ultimo||null; SINC.enviados=s.enviados||{}; }
  }catch(e){}
}
function gravarNuvemCfg(){
  try{
    localStorage.setItem(CHAVE_NUVEM, JSON.stringify({u:NUVEM.url,k:NUVEM.chave}));
    localStorage.setItem(CHAVE_SINC, JSON.stringify({ultimo:SINC.ultimo, enviados:SINC.enviados}));
  }catch(e){}
}
const publicado = ()=> location.protocol==='http:' || location.protocol==='https:';
function linkConfiguracao(){
  const b = btoa(unescape(encodeURIComponent(JSON.stringify({u:NUVEM.url,k:NUVEM.chave}))));
  return location.origin+location.pathname+'#n='+encodeURIComponent(b);
}
function ondeEstou(){
  if(location.protocol==='file:') return {ok:false, txt:'arquivo neste computador ('+location.pathname.split('/').pop()+')'};
  return {ok:true, txt:location.origin+location.pathname};
}

/* marca leve para detectar o que mudou sem guardar cópia dos dados */
function marca(txt){
  let h=5381; for(let i=0;i<txt.length;i++){ h=((h<<5)+h+txt.charCodeAt(i))|0; }
  return txt.length+':'+(h>>>0).toString(36);
}
/* a caderneta dividida em pedaços independentes */
function fragmentos(){
  const f = {
    capa: DB.capa,
    professores: DB.professores,
    catalogos: DB.catalogos,
    acessos: DB.acessos,
    pedidos: DB.pedidos,
    config: { gerente:DB.gerente, backup:{link:DB.backup.link} }
  };
  (DB.turmas||[]).forEach(t=> f['turma:'+t.id]=t);
  (DB.avaliacoes||[]).forEach(a=> f['avaliacao:'+a.id]=a);
  Object.keys(DB.aplicacoes||{}).forEach(k=> f['folha:'+k]=DB.aplicacoes[k]);
  Object.keys(DB.calculos||{}).forEach(k=> f['calculo:'+k]=DB.calculos[k]);
  const porTurma={};
  (DB.historico||[]).forEach(h=>{ const k=h.turma||'geral'; (porTurma[k]=porTurma[k]||[]).push(h); });
  Object.keys(porTurma).forEach(k=> f['historico:'+k]=porTurma[k].slice(0,300));
  return f;
}
const chaveHist = h => [h.ts,h.aluno||'',h.sub||'',h.depois||''].join('|');

function aplicarFragmento(chave, dados){
  const apagado = dados && dados.__apagado;
  if(chave==='capa'){ if(!apagado) DB.capa=Object.assign(vazioDB().capa, dados); return; }
  if(chave==='professores'){ if(Array.isArray(dados)) DB.professores=dados; return; }
  if(chave==='catalogos'){ if(dados&&dados.etapas) DB.catalogos=dados; return; }
  if(chave==='acessos'){ if(dados&&!apagado) DB.acessos=dados; return; }
  if(chave==='pedidos'){ if(Array.isArray(dados)) DB.pedidos=dados; return; }
  if(chave.startsWith('calculo:')){
    const k=chave.slice(8);
    if(apagado) delete DB.calculos[k]; else DB.calculos[k]=dados;
    return;
  }
  if(chave==='config'){
    if(dados && dados.gerente) DB.gerente=dados.gerente;
    if(dados && dados.backup) Object.assign(DB.backup, dados.backup);
    return;
  }
  if(chave.startsWith('turma:')){
    const id=chave.slice(6);
    DB.turmas=(DB.turmas||[]).filter(t=>t.id!==id);
    if(!apagado && dados) DB.turmas.push(dados);
    return;
  }
  if(chave.startsWith('avaliacao:')){
    const id=chave.slice(10);
    DB.avaliacoes=(DB.avaliacoes||[]).filter(a=>a.id!==id);
    if(!apagado && dados) DB.avaliacoes.push(dados);
    return;
  }
  if(chave.startsWith('folha:')){
    const k=chave.slice(6);
    if(apagado) delete DB.aplicacoes[k]; else DB.aplicacoes[k]=dados;
    return;
  }
  if(chave.startsWith('historico:')){
    const t=chave.slice(10);
    if(!Array.isArray(dados)) return;
    const vistos={}, junto=[];
    (DB.historico||[]).concat(dados).forEach(h=>{
      if((h.turma||'geral')!==t && (DB.historico||[]).includes(h)){ junto.push(h); return; }
      const k=chaveHist(h); if(vistos[k]) return; vistos[k]=1; junto.push(h);
    });
    DB.historico = junto.sort((a,b)=>b.ts-a.ts).slice(0,4000);
    return;
  }
}

async function api(caminho, opcoes){
  const o = opcoes||{};
  const r = await fetch(NUVEM.url.replace(/\/+$/,'')+'/rest/v1/'+caminho, {
    method: o.method||'GET',
    headers: Object.assign({
      apikey: NUVEM.chave,
      Authorization: 'Bearer '+NUVEM.chave,
      'Content-Type': 'application/json'
    }, o.headers||{}),
    body: o.body
  });
  if(!r.ok){ const t=await r.text(); throw new Error('HTTP '+r.status+' — '+t.slice(0,140)); }
  return r;
}

async function baixarNuvem(){
  const desde = SINC.ultimo ? `&atualizado_em=gt.${encodeURIComponent(SINC.ultimo)}` : '';
  const r = await api(`caderneta?select=chave,dados,atualizado_em${desde}&order=atualizado_em.asc`);
  const linhas = await r.json();
  let recebidos = 0;
  if(linhas.length){
    linhas.forEach(l=>{
      SINC.ultimo = l.atualizado_em;
      const m = marca(JSON.stringify(l.dados));
      // eco do que este aparelho mesmo enviou: aplicar de novo desfaria edições locais
      if(SINC.enviados[l.chave] === m) return;
      aplicarFragmento(l.chave, l.dados);
      if(l.dados && l.dados.__apagado) delete SINC.enviados[l.chave];
      else SINC.enviados[l.chave] = m;
      recebidos++;
    });
    try{ localStorage.setItem(CHAVE, JSON.stringify(DB)); }catch(e){}
  }
  jaBaixou=true;
  return recebidos;
}

async function enviarNuvem(tudo){
  const f = fragmentos(), envio=[];
  Object.keys(f).forEach(k=>{
    const m = marca(JSON.stringify(f[k]));
    if(tudo || SINC.enviados[k]!==m) envio.push({chave:k, dados:f[k], _m:m});
  });
  Object.keys(SINC.enviados).forEach(k=>{
    if(!(k in f)) envio.push({chave:k, dados:{__apagado:true}, _m:null});
  });
  if(!envio.length) return 0;
  const corpo = envio.map(e=>({chave:e.chave, dados:e.dados}));
  await api('caderneta', {method:'POST', body:JSON.stringify(corpo),
    headers:{Prefer:'resolution=merge-duplicates,return=minimal'}});
  envio.forEach(e=>{ if(e._m===null) delete SINC.enviados[e.chave]; else SINC.enviados[e.chave]=e._m; });
  return envio.length;
}

/* traduz as falhas mais comuns do Supabase para linguagem de quem vai resolver */
function explicaErro(m){
  const t=String(m||'');
  if(/HTTP 401|No API key|Invalid API key|JWT/i.test(t))
    return 'Chave recusada (401). Confira se copiou a chave pública inteira, em Settings → API Keys.';
  if(/HTTP 404|does not exist|Not Found/i.test(t))
    return 'Tabela não encontrada (404). Rode o arquivo supabase-caderneta.sql no SQL Editor do projeto.';
  if(/HTTP 40[39]|row-level security|permission denied/i.test(t))
    return 'Permissão negada. Rode de novo o SQL, que é o que libera a leitura e a escrita.';
  if(/Failed to fetch|NetworkError|ENOTFOUND|getaddrinfo/i.test(t))
    return 'Não consegui alcançar o endereço. Confira a internet e se o endereço do projeto está correto.';
  return t;
}

async function sincronizar(silencioso, tudo){
  if(!nuvemLigada() || sincronizando) return 'desligado';
  sincronizando=true; SINC.estado='sincronizando'; pintaNuvem();
  try{
    const baixados = await baixarNuvem();
    let enviados = 0;
    if(!cadernetaVazia() || tudo) enviados = await enviarNuvem(tudo);
    SINC.estado='ok'; SINC.erro=''; SINC.em=Date.now();
    gravarNuvemCfg(); pintaNuvem();
    if(baixados && sessao) renderSeguro();
    if(!silencioso) toast(`Sincronizado: ${baixados} recebido(s), ${enviados} enviado(s).`);
    return 'ok';
  }catch(e){
    SINC.estado='erro'; SINC.erro=explicaErro(e.message); pintaNuvem();
    if(!silencioso) toast('Falha na sincronização: '+SINC.erro);
    return 'erro';
  }finally{ sincronizando=false; }
}
function agendarSinc(){
  if(!nuvemLigada()) return;
  clearTimeout(timerSinc);
  timerSinc=setTimeout(()=>sincronizar(true), 2500);
}
function pintaNuvem(){
  const el=$('#statusNuvem'); if(!el) return;
  if(!nuvemLigada()){ el.innerHTML=''; return; }
  const cor={ok:'#a9d6b6', sincronizando:'#cfe0e9', erro:'#f3b0ab', desligado:'#cfe0e9'}[SINC.estado]||'#cfe0e9';
  const txt={ok:'Nuvem: em dia', sincronizando:'Nuvem: sincronizando…', erro:'Nuvem: falha', desligado:'Nuvem: —'}[SINC.estado];
  el.innerHTML=`<span style="color:${cor}">${txt}</span>`;
}

/* painel usado nas telas do professor e do gerenciador */
function painelNuvem(podeEditar){
  const est = !nuvemLigada() ? 'não configurada'
    : {ok:'em dia', sincronizando:'sincronizando', erro:'com falha', desligado:'aguardando'}[SINC.estado];
  return `<div class="painel" style="border-left:5px solid ${nuvemLigada()?(SINC.estado==='erro'?'var(--carimbo)':'var(--verde)'):'var(--ambar)'}">
    <h3>Caderneta na nuvem</h3>
    <p class="desc">Com a nuvem ligada, qualquer aparelho com internet abre a mesma caderneta e o que você lança aparece para os outros professores.</p>
    ${!publicado()? `<div class="aviso erro">
      <strong>Este app está aberto como arquivo do computador.</strong>
      Nenhum outro aparelho consegue chegar até aqui, e o link de configuração não funciona fora desta máquina.
      Publique o arquivo num endereço da internet antes de ligar a nuvem.
    </div>`:''}
    <div class="aviso" style="font-family:var(--mono);font-size:11.5px">Aberto de: ${esc(ondeEstou().txt)}</div>
    <div class="aviso ${nuvemLigada()&&SINC.estado!=='erro'?'bom':(nuvemLigada()?'erro':'')}">
      Estado: <strong>${est}</strong>.
      ${SINC.em?` Última troca: ${dataHora(SINC.em)}.`:''}
      ${SINC.erro?`<br>${esc(SINC.erro)}`:''}
      ${!nuvemLigada()?'<br>Sem isso, os dados ficam apenas neste aparelho.':''}
    </div>
    ${podeEditar?`
      <div class="linha" style="margin-bottom:10px">
        <div class="campo"><label>Endereço do projeto</label><input id="nvUrl" value="${esc(NUVEM.url)}" placeholder="https://xxxxxxxx.supabase.co"></div>
      </div>
      <div class="linha" style="margin-bottom:10px">
        <div class="campo"><label>Chave pública (anon / publishable)</label><input id="nvChave" value="${esc(NUVEM.chave)}" placeholder="eyJhbGciOi… ou sb_publishable_…"></div>
        <button class="btn" id="nvSalvar">Salvar e conectar</button>
      </div>
      ${nuvemLigada()?`
        <div class="acoes">
          <button class="btn sec" id="nvSinc">Sincronizar agora</button>
          <button class="btn sec" id="nvTudo">Enviar tudo para a nuvem</button>
          <button class="btn sec" id="nvLink">Copiar link para os professores</button>
          <button class="btn perigo" id="nvOff">Desconectar</button>
        </div>
        <div class="aviso" style="margin-top:12px">
          Quem abrir o link de configuração passa a enxergar e alterar esta caderneta. Trate-o como uma senha:
          mande apenas aos professores, por mensagem direta.
        </div>`:''}
    `:`
      <div class="acoes">
        <button class="btn sec" id="nvSinc" ${nuvemLigada()?'':'disabled'}>Sincronizar agora</button>
      </div>
      ${!nuvemLigada()?'<div class="aviso">Peça ao gerenciador o link de configuração da nuvem.</div>':''}
    `}
  </div>`;
}
function ligarPainelNuvem(){
  if($('#nvSinc')) $('#nvSinc').onclick=()=>sincronizar(false);
  if($('#nvSalvar')) $('#nvSalvar').onclick=async()=>{
    let u=$('#nvUrl').value.trim().replace(/\/+$/,'');
    const k=$('#nvChave').value.trim();
    // tolerâncias comuns: endereço colado sem esquema, ou com o caminho da API junto
    if(u && !/^https?:\/\//i.test(u)) u='https://'+u;
    u=u.replace(/\/rest\/v1.*$/i,'').replace(/\/+$/,'');
    if(u && !/^https?:\/\/[^\s\/]+/i.test(u)) return toast('Endereço inválido. Use algo como https://xxxx.supabase.co');
    if(u) $('#nvUrl').value=u;
    if(u && k && /^https?:\/\//i.test(k)) return toast('Os campos parecem trocados: o endereço vai no primeiro, a chave no segundo.');
    NUVEM={url:u, chave:k}; SINC.ultimo=null; SINC.enviados={}; gravarNuvemCfg();
    if(!u||!k){ SINC.estado='desligado'; render(); return toast(u?'Falta a chave pública.':'Nuvem desligada.'); }
    const r = await sincronizar(false, true);
    render();
    if(r==='ok') toast('Conectado. A caderneta já está na nuvem.');
  };
  if($('#nvTudo')) $('#nvTudo').onclick=async()=>{ await sincronizar(false, true); render(); };
  if($('#nvOff')) $('#nvOff').onclick=()=>{
    if(!confirm('Desconectar este aparelho da nuvem? Os dados continuam salvos aqui.')) return;
    NUVEM={url:'',chave:''}; SINC={ultimo:null,enviados:{},estado:'desligado',erro:'',em:null};
    gravarNuvemCfg(); render(); toast('Desconectado.');
  };
  if($('#nvLink')) $('#nvLink').onclick=()=>{
    if(!publicado()){
      abrirModal(`<h3>Ainda não dá para gerar o link</h3>
        <p style="font-size:13.5px">O app está sendo aberto como arquivo desta máquina
        (<span style="font-family:var(--mono)">${esc(location.protocol+'//'+location.pathname)}</span>),
        e não por um endereço da internet. Um link assim não abre em nenhum outro aparelho.</p>
        <div class="aviso">Publique o arquivo — renomeando-o para <strong>index.html</strong> — no GitHub Pages ou em
        <strong>app.netlify.com/drop</strong>. Depois abra o app pelo endereço publicado, reconecte a nuvem e o link passa a funcionar.</div>
        <div class="acoes"><button class="btn" data-fechar>Entendi</button></div>`);
      return;
    }
    const l=linkConfiguracao();
    if(navigator.clipboard) navigator.clipboard.writeText(l).then(()=>toast('Link copiado.'),()=>0);
    abrirModal(`<h3>Link de configuração</h3>
      <p style="color:var(--tinta-fraca);font-size:13.5px">Cada professor abre este endereço uma vez no aparelho dele. Depois disso, basta abrir o app normalmente.</p>
      <textarea readonly style="min-height:90px;font-family:var(--mono);font-size:12px">${esc(l)}</textarea>
      <div class="acoes" style="margin-top:12px"><button class="btn" data-fechar>Fechar</button></div>`);
  };
}

/* =======================================================================

   ======================================================================= */
async function iniciar(){
  carregar();
  // migração: conta única antiga vira o primeiro professor liberado
  if(DB.prof && DB.prof.hash && !DB.professores.length){
    DB.professores.push({id:uid(), nome:(DB.capa.professor||'Professor').trim(), hash:DB.prof.hash,
      dica:DB.prof.dica||'', status:'ativo', criadoEm:Date.now(), liberadoEm:Date.now()});
  }
  if(!DB.gerente.hash){
    DB.gerente.hash = await hash('maracuja');
    try{ localStorage.setItem(CHAVE, JSON.stringify(DB)); }catch(e){}
  }
  carregarNuvem();
  if(nuvemLigada()) await sincronizar(true);
  setInterval(()=>{ if(nuvemLigada() && !sincronizando) sincronizar(true); }, 20000);
  telaAcesso();
}
iniciar();
window.addEventListener('beforeunload', e=>{ if(sessao&&sessao.tipo==='prof') salvar(true); });
</script>
