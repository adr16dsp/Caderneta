<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Caderneta — Lançamento e acompanhamento de notas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --papel:#F2F4F0;
  --papel-2:#E8ECE5;
  --superficie:#FFFFFF;
  --tinta:#16232E;
  --tinta-fraca:#5B6A75;
  --azul:#1D4E6B;
  --azul-claro:#E4EEF3;
  --pauta:#CBD9C6;
  --pauta-fraca:#E6EDE3;
  --carimbo:#B3271E;
  --carimbo-fraco:#FBEDEC;
  --ambar:#B07A12;
  --ambar-fraco:#FCF3E0;
  --verde:#2E6E4E;
  --raio:4px;
  --display:"Zilla Slab",Georgia,"Times New Roman",serif;
  --corpo:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--papel);
  color:var(--tinta);
  font-family:var(--corpo);
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--display);font-weight:600;margin:0;line-height:1.2}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
input,select,textarea{
  background:#fff;border:1px solid var(--pauta);border-radius:var(--raio);
  padding:7px 9px;width:100%;
}
input:focus,select:focus,textarea:focus,button:focus-visible{
  outline:2px solid var(--azul);outline-offset:1px;border-color:var(--azul)
}
textarea{min-height:70px;resize:vertical}
label{display:block;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--tinta-fraca);margin-bottom:4px}
.linha{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.campo{flex:1 1 180px;min-width:0}
.btn{
  display:inline-flex;align-items:center;gap:6px;justify-content:center;
  background:var(--azul);color:#fff;border:1px solid var(--azul);
  padding:8px 14px;border-radius:var(--raio);cursor:pointer;font-weight:600;font-size:14px;
  width:auto;transition:filter .12s ease;
}
.btn:hover{filter:brightness(1.15)}
.btn.sec{background:#fff;color:var(--azul)}
.btn.sec:hover{background:var(--azul-claro);filter:none}
.btn.perigo{background:#fff;color:var(--carimbo);border-color:var(--carimbo)}
.btn.perigo:hover{background:var(--carimbo-fraco);filter:none}
.btn.min{padding:4px 8px;font-size:12.5px;font-weight:600}
.btn.mini{padding:1px 5px;font-size:10.5px;font-weight:700;letter-spacing:.03em;border-radius:3px}
.atalhos{display:flex;gap:3px;margin-top:3px}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.chip{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11.5px;font-weight:600;letter-spacing:.03em}
.chip.ok{background:#E6F1EA;color:var(--verde)}
.chip.esp{background:var(--ambar-fraco);color:var(--ambar)}
.chip.off{background:var(--papel-2);color:var(--tinta-fraca)}

/* ————— Acesso ————— */
#acesso{min-height:100vh;display:grid;place-items:center;padding:24px}
.cartao-acesso{
  width:100%;max-width:430px;background:var(--superficie);
  border:1px solid var(--pauta);border-radius:6px;overflow:hidden;
  box-shadow:0 1px 0 var(--pauta-fraca),0 18px 40px -28px rgba(22,35,46,.5);
}
.capa-topo{
  background:var(--azul);color:#fff;padding:26px 26px 22px;
  background-image:repeating-linear-gradient(180deg,rgba(255,255,255,.06) 0 1px,transparent 1px 26px);
}
.capa-topo .selo{font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;opacity:.75}
.capa-topo h1{font-size:34px;letter-spacing:-.01em;margin-top:6px;color:#fff}
.capa-topo p{margin:6px 0 0;font-size:13.5px;opacity:.85}
.abas-acesso{display:flex;border-bottom:1px solid var(--pauta)}
.abas-acesso button{
  flex:1;background:var(--papel-2);border:0;border-bottom:3px solid transparent;
  padding:12px;cursor:pointer;font-weight:600;color:var(--tinta-fraca);
}
.abas-acesso button[aria-selected="true"]{background:#fff;color:var(--azul);border-bottom-color:var(--azul)}
.corpo-acesso{padding:22px 26px 26px;display:grid;gap:14px}

/* ————— Estrutura ————— */
#app{display:none;min-height:100vh;grid-template-columns:236px 1fr}
#app.ativo{display:grid}
#app.aluno,#app.gerente{grid-template-columns:1fr}
#app.aluno aside,#app.gerente aside{display:none}
.discreto{
  background:none;border:0;padding:6px 4px;width:auto;cursor:pointer;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--pauta);transition:color .15s ease;
}
.discreto:hover,.discreto:focus-visible{color:var(--azul)}
.rodape-acesso{display:flex;justify-content:flex-end;padding:0 18px 10px;margin-top:-14px}
aside{
  background:var(--azul);color:#cfe0e9;padding:18px 0;position:sticky;top:0;height:100vh;overflow:auto;
}
aside .marca{padding:0 20px 16px;border-bottom:1px solid rgba(255,255,255,.16)}
aside .marca strong{display:block;font-family:var(--display);font-size:22px;color:#fff;letter-spacing:.01em}
aside .marca span{font-size:11.5px;font-family:var(--mono);letter-spacing:.14em;text-transform:uppercase;opacity:.7}
nav{padding:12px 10px;display:grid;gap:2px}
nav button{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;border:0;
  color:#cfe0e9;padding:9px 12px;border-radius:var(--raio);cursor:pointer;font-size:14.5px;font-weight:500;
}
nav button:hover{background:rgba(255,255,255,.09);color:#fff}
nav button.on{background:#fff;color:var(--azul);font-weight:600}
nav .num{font-family:var(--mono);font-size:11px;opacity:.6;width:16px}
nav button.on .num{opacity:.5}
aside .rodape{padding:14px 20px;font-size:12px;opacity:.7;border-top:1px solid rgba(255,255,255,.16);margin-top:10px}
main{padding:26px 30px 90px;max-width:1240px}
.cabeca{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.cabeca h2{font-size:27px}
.cabeca .sub{color:var(--tinta-fraca);font-size:13.5px;margin-top:3px}
.painel{
  background:var(--superficie);border:1px solid var(--pauta);border-radius:6px;
  padding:20px;margin-bottom:18px;
}
.painel > h3{font-size:17px;margin-bottom:3px}
.painel > .desc{color:var(--tinta-fraca);font-size:13px;margin:0 0 14px}
.vazio{
  border:1px dashed var(--pauta);border-radius:6px;padding:26px;text-align:center;
  color:var(--tinta-fraca);font-size:14px;background:repeating-linear-gradient(180deg,transparent 0 25px,var(--pauta-fraca) 25px 26px);
}
.vazio strong{display:block;color:var(--tinta);font-family:var(--display);font-size:17px;margin-bottom:4px}

/* ————— Tabelas de pauta ————— */
.pauta{width:100%;border-collapse:collapse;font-size:14px}
.pauta th{
  text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--tinta-fraca);
  font-weight:700;padding:8px 10px;border-bottom:2px solid var(--azul);white-space:nowrap;vertical-align:bottom;
}
.pauta td{padding:6px 10px;border-bottom:1px solid var(--pauta-fraca)}
.pauta tbody tr:nth-child(even){background:#FAFBF9}
.pauta tbody tr:hover{background:var(--azul-claro)}
.pauta .ord{
  font-family:var(--mono);font-size:12px;color:var(--tinta-fraca);width:34px;text-align:right;
  border-right:1px solid var(--pauta);
}
.pauta .nome{font-weight:500;min-width:180px}
.pauta .num,.pauta td input[type=number]{font-family:var(--mono);font-variant-numeric:tabular-nums}
.pauta td input[type=number]{width:78px;padding:5px 6px;text-align:right}
.pauta .final{font-family:var(--mono);font-weight:700;font-size:15px;text-align:right}
.rolagem{overflow-x:auto;margin:0 -20px;padding:0 20px}
.faltou{background:var(--carimbo-fraco)!important;color:var(--carimbo);text-decoration:line-through}
.marca-just{color:var(--ambar);font-weight:700;cursor:pointer;background:none;border:0;padding:0 4px;width:auto}

/* ————— Carimbo (assinatura visual) ————— */
.carimbo{
  display:inline-flex;flex-direction:column;align-items:center;gap:2px;
  border:3px double var(--carimbo);color:var(--carimbo);
  padding:8px 18px;border-radius:3px;transform:rotate(-3.5deg);
  font-family:var(--display);text-transform:uppercase;letter-spacing:.14em;
  font-weight:700;font-size:16px;line-height:1.1;background:var(--carimbo-fraco);
}
.carimbo small{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;font-weight:400;opacity:.85}
.carimbo.liberado{border-color:var(--verde);color:var(--verde);background:#EAF3EE;transform:rotate(2deg)}
.faixa-visib{
  display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;
  border:1px solid var(--pauta);border-left:5px solid var(--carimbo);
  background:#fff;padding:14px 18px;border-radius:6px;margin-bottom:18px;
}
.faixa-visib.on{border-left-color:var(--verde)}
.faixa-visib .txt strong{display:block;font-family:var(--display);font-size:17px}
.faixa-visib .txt span{font-size:13px;color:var(--tinta-fraca)}

/* ————— Diversos ————— */
.lista{display:grid;gap:8px}
.item{
  display:flex;align-items:center;gap:12px;justify-content:space-between;
  border:1px solid var(--pauta);border-radius:var(--raio);padding:10px 14px;background:#fff;
}
.item.sel{border-color:var(--azul);background:var(--azul-claro);box-shadow:inset 3px 0 0 var(--azul)}
.item .t{font-weight:600}
.item .d{font-size:12.5px;color:var(--tinta-fraca)}
.acoes{display:flex;gap:6px;flex-wrap:wrap}
.grade{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.pill{font-family:var(--mono);font-size:11.5px;background:var(--papel-2);padding:2px 7px;border-radius:3px;color:var(--tinta-fraca)}
.aviso{border-left:4px solid var(--ambar);background:var(--ambar-fraco);padding:10px 14px;border-radius:var(--raio);font-size:13.5px;margin:10px 0}
.aviso.erro{border-color:var(--carimbo);background:var(--carimbo-fraco)}
.aviso.bom{border-color:var(--verde);background:#EAF3EE}
.colar{
  border:2px dashed var(--pauta);border-radius:6px;padding:18px;text-align:center;color:var(--tinta-fraca);
  cursor:pointer;background:#fff;font-size:13.5px;
}
.colar:focus{outline:2px solid var(--azul)}
.colar img{max-width:100%;max-height:220px;border-radius:var(--raio);display:block;margin:0 auto}
.subcard{border:1px solid var(--pauta);border-left:4px solid var(--azul);border-radius:var(--raio);padding:14px;background:#FCFDFB;margin-bottom:10px}
.subcard header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.subcard header .t{font-family:var(--display);font-size:16px;font-weight:600}
details.q{border-top:1px dashed var(--pauta);margin-top:10px;padding-top:8px}
details.q summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--azul)}
.qgrade{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-top:10px}
.qitem{border:1px solid var(--pauta);border-radius:var(--raio);padding:6px 8px;background:#fff}
.qitem .qn{font-family:var(--mono);font-size:11px;color:var(--tinta-fraca)}
.qbox{display:flex;gap:6px;align-items:center}
.qbox input{padding:3px 5px;text-align:center}
.escolhas{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.escolhas button{border:1px solid var(--pauta);background:#fff;border-radius:20px;padding:3px 11px;font-size:12.5px;cursor:pointer;width:auto}
.escolhas button.on{background:var(--azul);color:#fff;border-color:var(--azul)}
.modal{position:fixed;inset:0;background:rgba(22,35,46,.55);display:grid;place-items:center;padding:20px;z-index:60}
.modal .cx{background:#fff;border-radius:6px;max-width:600px;width:100%;max-height:88vh;overflow:auto;padding:22px;border-top:5px solid var(--azul)}
.modal h3{font-size:20px;margin-bottom:12px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--tinta);color:#fff;padding:10px 18px;border-radius:20px;font-size:13.5px;z-index:99;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
.salvo{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--tinta-fraca)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--pauta);margin-bottom:16px;flex-wrap:wrap}
.tabs button{background:transparent;border:0;border-bottom:3px solid transparent;padding:9px 14px;cursor:pointer;font-weight:600;color:var(--tinta-fraca);width:auto}
.tabs button.on{color:var(--azul);border-bottom-color:var(--azul)}

/* ————— Aluno ————— */
.boletim{max-width:820px;margin:0 auto}
.boletim .cabeca-b{background:var(--azul);color:#fff;padding:22px 24px;border-radius:6px 6px 0 0}
.boletim .cabeca-b h2{color:#fff;font-size:24px}
.boletim .cabeca-b p{margin:4px 0 0;opacity:.85;font-size:13.5px}
.corpo-b{background:#fff;border:1px solid var(--pauta);border-top:0;border-radius:0 0 6px 6px;padding:22px}
.bloco-av{border:1px solid var(--pauta);border-radius:var(--raio);margin-bottom:12px;overflow:hidden}
.bloco-av > summary{padding:12px 14px;cursor:pointer;display:flex;justify-content:space-between;gap:12px;align-items:center;background:#FBFCFA;font-weight:600}
.bloco-av > div{padding:14px;border-top:1px solid var(--pauta-fraca)}
.notao{font-family:var(--mono);font-size:34px;font-weight:700;color:var(--azul);font-variant-numeric:tabular-nums}

/* ————— Impressão ————— */
#impressao{display:none}
@media print{
  body{background:#fff}
  aside,nav,.naoimprime,#toast{display:none!important}
  #app{display:block!important}
  main{padding:0;max-width:none}
  #impressao{display:block}
  .painel{border:0;padding:0;margin:0}
  .pauta{font-size:11px}
  .pauta th{border-bottom:1.5px solid #000;color:#000}
  .pauta td{border-bottom:1px solid #ccc}
  .pauta tbody tr:nth-child(even){background:#f4f4f4!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  @page{margin:1.4cm}
}
@media (max-width:820px){
  #app.ativo{grid-template-columns:1fr}
  aside{position:static;height:auto}
  nav{grid-template-columns:repeat(2,1fr);display:grid}
  main{padding:18px 14px 70px}
  .rolagem{margin:0 -20px;padding:0 20px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<!-- ===================== ACESSO ===================== -->
<section id="acesso">
  <div class="cartao-acesso">
    <div class="capa-topo">
      <div class="selo" id="seloCapa">Diário de notas</div>
      <h1 id="tituloCapa">Caderneta</h1>
      <p id="subCapa">Lançamento, cálculo e acompanhamento de notas.</p>
    </div>
    <div class="abas-acesso" role="tablist">
      <button role="tab" aria-selected="true" data-aba="prof">Professor</button>
      <button role="tab" aria-selected="false" data-aba="aluno">Aluno</button>
    </div>
    <div class="corpo-acesso" id="formAcesso"></div>
    <div class="rodape-acesso"><button class="discreto" id="btnGerente" title="Acesso restrito">Gerenciador</button></div>
  </div>
</section>

<!-- ===================== APP ===================== -->
<div id="app">
  <aside class="naoimprime">
    <div class="marca">
      <span id="marcaSelo">Diário de notas</span>
      <strong id="marcaNome">Caderneta</strong>
    </div>
    <nav id="menu"></nav>
    <div class="rodape">
      <div class="salvo" id="statusSalvo">—</div>
      <div class="salvo" id="statusNuvem" style="margin-top:4px"></div>
      <button class="btn sec min" style="margin-top:8px" id="btnSair">Sair</button>
    </div>
  </aside>
  <main id="tela"></main>
</div>

<div id="toast"></div>
<div id="modais"></div>
<script>
/* =======================================================================
   CADERNETA — app offline de lançamento e acompanhamento de notas
   Estrutura: DB único em memória, persistido em localStorage + Drive/JSON
   ======================================================================= */

const CHAVE = 'caderneta_v1';
let memoria = null; // reserva quando localStorage não está disponível

const ETAPAS_PADRAO = ['Ensino Fundamental I','Ensino Fundamental II','Ensino Médio'];
const TURNOS_PADRAO = ['Manhã','Tarde','Noite','Integral'];
const NOMES_PADRAO  = ['A','B','C','D','E'];

const vazioDB = () => ({
  versao: 2,
  capa: { instituicao:'', tipoPeriodo:'Bimestre', periodo:'', ano:String(new Date().getFullYear()) },
  prof: { hash:'', dica:'' },      // conta antiga, migrada para 'professores'
  professores: [],   // {id, nome, disciplina, hash, dica, status:'ativo'|'pendente', criadoEm, liberadoEm}
  gerente: { hash:'' },
  catalogos: { etapas:[...ETAPAS_PADRAO], turnos:[...TURNOS_PADRAO], nomes:[...NOMES_PADRAO], materias:{} },
  turmas: [],        // {id, etapa, serie, turno, nome, alunos:[{id,nome,senha,resetLiberado}]}
  acessos: {},       // "profId::turmaId" -> {status:'pendente'|'ativo', pedidoEm, liberadoEm}
  avaliacoes: [],    // {id, profId, nome, descricao, max, modoSub, subs:[...]}
  aplicacoes: {},    // "turmaId::avalId" -> {visivel, liberadoEm, notas:{alunoId:{subId:{...}}}}
  calculos: {},      // "turmaId::profId" -> {modo:'media'|'pesos', maxFinal, pesos:{avalId:valor}}
  pedidos: [],       // {id, tipo:'excluir-aluno', profId, turmaId, alunoId, nome, motivo, status, em}
  historico: [],     // {ts, turma, aluno, aval, sub, antes, depois, autor}
  backup: { link:'' },
  atualizadoEm: 0
});

let DB = vazioDB();
let sessao = null;    // {tipo:'prof'} | {tipo:'aluno', turmaId, alunoId}
let vista = 'capa';
let ctx = {};         // contexto de navegação (turma selecionada, avaliação em edição etc.)

/* ---------------- utilidades ---------------- */
const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const uid = ()=> Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = (v,p=0)=> (v===null||v===undefined||v==='' ) ? p : (isNaN(parseFloat(v))?p:parseFloat(String(v).replace(',','.')));
const fmt = (v,c=2)=> (v===null||v===undefined||isNaN(v)) ? '—' : Number(v).toFixed(c).replace('.',',');
const dataHora = ts => new Date(ts).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
const normal = s => String(s||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ');
const ordAlfa = (a,b)=> normal(a.nome).localeCompare(normal(b.nome),'pt-BR');

function toast(msg){
  const t=$('#toast'); t.textContent=msg; t.classList.add('on');
  clearTimeout(t._x); t._x=setTimeout(()=>t.classList.remove('on'),2600);
}

/* ---------------- persistência ---------------- */
let timerSalvar=null;
function salvar(silencioso){
  DB.atualizadoEm = Date.now();
  const txt = JSON.stringify(DB);
  try{ localStorage.setItem(CHAVE, txt); }catch(e){ memoria = txt; }
  const s=$('#statusSalvo');
  if(s) s.textContent = 'Salvo às '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  agendarSinc();
  if(!silencioso) return true;
}
function carregar(){
  let txt=null;
  try{ txt = localStorage.getItem(CHAVE); }catch(e){ txt = memoria; }
  if(!txt) return false;
  try{
    const d = JSON.parse(txt);
    DB = Object.assign(vazioDB(), d);
    const z = vazioDB();
    DB.capa = Object.assign(z.capa, d.capa||{});
    DB.gerente = Object.assign(z.gerente, d.gerente||{});
    DB.backup = Object.assign(z.backup, d.backup||{});
    DB.catalogos = Object.assign(z.catalogos, d.catalogos||{});
    if(!DB.catalogos.materias || Array.isArray(DB.catalogos.materias)) DB.catalogos.materias={};
    DB.professores = Array.isArray(d.professores)?d.professores:[];
    DB.pedidos = Array.isArray(d.pedidos)?d.pedidos:[];
    DB.acessos = d.acessos||{}; DB.calculos = d.calculos||{};
    migrar();
    return true;
  }catch(e){ return false; }
}

/* passagem da caderneta de um professor só para a caderneta da escola */
function migrar(){
  // disciplina única -> lista de disciplinas
  DB.professores.forEach(p=>{
    if(!Array.isArray(p.disciplinas)) p.disciplinas = p.disciplina? [p.disciplina] : [];
  });
  DB.avaliacoes.forEach(a=>{
    if(a.disc===undefined){
      const dono=profPorId(a.profId);
      a.disc = dono ? (discsDoProf(dono)[0]||'') : '';
    }
  });
  // acessos antigos (prof::turma) passam a valer para cada disciplina do professor
  Object.keys(DB.acessos||{}).forEach(k=>{
    if(k.split('::').length===2){
      const [pid,tid]=k.split('::'); const v=DB.acessos[k];
      const ds=discsDoProf(pid);
      (ds.length?ds:['']).forEach(d=>{ DB.acessos[pid+'::'+tid+'::'+d]=Object.assign({},v); });
      delete DB.acessos[k];
    }
  });
  // cálculos antigos (turma::prof) ganham a primeira disciplina do professor
  Object.keys(DB.calculos||{}).forEach(k=>{
    if(k.split('::').length===2){
      const [tid,pid]=k.split('::');
      DB.calculos[tid+'::'+pid+'::'+(discsDoProf(pid)[0]||'')] = DB.calculos[k];
      delete DB.calculos[k];
    }
  });
  if(DB.versao>=2 && DB.turmas.every(t=>t.etapa!==undefined)) return;
  const dono = (DB.professores[0]||{}).id || null;
  if(DB.professores.length===1 && !discsDoProf(DB.professores[0]).length && (DB.capa||{}).disciplina){
    DB.professores[0].disciplinas = [DB.capa.disciplina];
    DB.avaliacoes.forEach(a=>{ if(!a.disc) a.disc = DB.capa.disciplina; });
  }
  DB.turmas.forEach(t=>{
    if(t.etapa===undefined){
      t.etapa = 'Ensino Médio'; t.serie=''; t.turno='Manhã';
      t.nome = t.nome||'A';
    }
    if(t.calc && dono){ DB.calculos[t.id+'::'+dono+'::'+(discsDoProf(dono)[0]||(DB.capa||{}).disciplina||'')] = t.calc; }
    delete t.calc;
    if(dono){
      const ds = discsDoProf(dono); const agora=Date.now();
      (ds.length?ds:['']).forEach(d=>{ DB.acessos[dono+'::'+t.id+'::'+d] = {status:'ativo', pedidoEm:agora, liberadoEm:agora}; });
    }
  });
  DB.avaliacoes.forEach(a=>{ if(!a.profId && dono) a.profId = dono; });
  delete DB.capa.disciplina; delete DB.capa.professor;
  DB.versao = 2;
}

/* SHA-256 em JS puro: o resultado é idêntico em file://, http:// e https://,
   então as senhas continuam válidas em qualquer forma de abrir o arquivo. */
const K256=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
function utf8bytes(str){
  if(typeof TextEncoder!=='undefined') return [...new TextEncoder().encode(str)];
  const b=[]; for(const ch of unescape(encodeURIComponent(str))) b.push(ch.charCodeAt(0)); return b;
}
function sha256hex(texto){
  const msg=utf8bytes(texto), bits=msg.length*8;
  msg.push(0x80); while(msg.length%64!==56) msg.push(0);
  const alto=Math.floor(bits/4294967296), baixo=bits>>>0;
  msg.push(alto>>>24&255,alto>>>16&255,alto>>>8&255,alto&255,baixo>>>24&255,baixo>>>16&255,baixo>>>8&255,baixo&255);
  let H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const rr=(x,n)=>(x>>>n)|(x<<(32-n));
  const w=new Array(64);
  for(let i=0;i<msg.length;i+=64){
    for(let j=0;j<16;j++) w[j]=(msg[i+4*j]<<24)|(msg[i+4*j+1]<<16)|(msg[i+4*j+2]<<8)|msg[i+4*j+3];
    for(let j=16;j<64;j++){
      const s0=rr(w[j-15],7)^rr(w[j-15],18)^(w[j-15]>>>3);
      const s1=rr(w[j-2],17)^rr(w[j-2],19)^(w[j-2]>>>10);
      w[j]=(w[j-16]+s0+w[j-7]+s1)|0;
    }
    let [a,b,c,d,e,f,g,h]=H;
    for(let j=0;j<64;j++){
      const S1=rr(e,6)^rr(e,11)^rr(e,25), ch=(e&f)^(~e&g);
      const t1=(h+S1+ch+K256[j]+w[j])|0;
      const S0=rr(a,2)^rr(a,13)^rr(a,22), maj=(a&b)^(a&c)^(b&c);
      const t2=(S0+maj)|0;
      h=g;g=f;f=e;e=(d+t1)|0;d=c;c=b;b=a;a=(t1+t2)|0;
    }
    H=[H[0]+a|0,H[1]+b|0,H[2]+c|0,H[3]+d|0,H[4]+e|0,H[5]+f|0,H[6]+g|0,H[7]+h|0];
  }
  return H.map(x=>(x>>>0).toString(16).padStart(8,'0')).join('');
}
async function hash(txt){ return sha256hex('caderneta::'+txt); }

document.addEventListener('click', async e=>{
  const b=e.target.closest('button'); if(!b) return;

  if(b.dataset.aba){ abaAcesso=b.dataset.aba; telaCadastro=false; desenhaAcesso(); return; }
  if(b.id==='btnGerente'){ abaAcesso='gerente'; telaCadastro=false; desenhaAcesso(); return; }
  if(b.id==='btnVoltarAcesso'){ abaAcesso='prof'; telaCadastro=false; desenhaAcesso(); return; }

  if(b.id==='btnEntrarGer'){
    const h = await hash($('#g1').value);
    if(h!==DB.gerente.hash) return toast('Senha do gerenciador incorreta.');
    sessao={tipo:'gerente'}; abrirApp(); return;
  }
  if(b.id==='btnSolicitarOk'){
    const nome=$('#rNome').value.trim(), r1=$('#r1').value, r2=$('#r2').value;
    if(!nome) return toast('Informe o seu nome.');
    if(DB.professores.some(p=>normal(p.nome)===normal(nome))) return toast('Já existe um cadastro com esse nome.');
    if(r1.length<4) return toast('Use pelo menos 4 caracteres na senha.');
    if(r1!==r2) return toast('As senhas não coincidem.');
    DB.professores.push({id:uid(), nome, disciplinas:$('#rDisc').value.split(/[,;]/).map(x=>x.trim()).filter(Boolean),
      hash:await hash(r1), dica:$('#rd').value.trim(), status:'pendente', criadoEm:Date.now(), liberadoEm:null});
    salvar(); telaCadastro=false; desenhaAcesso();
    toast('Solicitação enviada. Aguarde a liberação do gerenciador.'); return;
  }
  if(b.id==='btnEntrarProf'){
    const nome=$('#pNome').value.trim();
    const prof = DB.professores.find(p=>normal(p.nome)===normal(nome));
    if(!prof) return toast('Professor não encontrado. Solicite o cadastro.');
    if(prof.status!=='ativo') return toast('Cadastro ainda pendente. Procure o gerenciador para liberar.');
    const h = await hash($('#p1').value);
    if(h!==prof.hash) return toast('Senha incorreta.'+(prof.dica?' Dica: '+prof.dica:''));
    sessao={tipo:'prof', profId:prof.id}; abrirApp(); return;
  }
  if(b.id==='btnRestaurar'){ importarJSON(); return; }

  if(b.id==='btnEntrarAluno'){

    const aluno = turma.alunos.find(a=>normal(a.nome)===normal(nome));
    if(!aluno) return toast('Nome não encontrado nesta turma. Confira a grafia com o professor.');
    if(!aluno.senha || aluno.resetLiberado){
      modalNovaSenha(turma, aluno); return;
    }
    const h = await hash(senha);
    if(h!==aluno.senha) return toast('Senha incorreta. Procure o professor para liberar a redefinição.');
    sessao={tipo:'aluno', turmaId:turma.id, alunoId:aluno.id}; abrirApp(); return;
  }
  if(b.id==='btnSair'){ sessao=null; ctx={}; vista='capa'; telaAcesso(); return; }
  if(b.dataset.vista){ vista=b.dataset.vista; ctx.aba=null; render(); return; }
});

<script>
/* =======================================================================
   MOTOR DE CÁLCULO
   ======================================================================= */
const chaveApl = (t,a)=> t+'::'+a;
function apl(turmaId, avalId, criar){
  const k = chaveApl(turmaId, avalId);
  if(!DB.aplicacoes[k] && criar) DB.aplicacoes[k] = {visivel:false, liberadoEm:null, notas:{}};
  return DB.aplicacoes[k] || null;
}
/* ----- turmas, acessos e disciplinas ----- */
const rotuloTurma = t => !t ? '—' :
  [[t.serie?t.serie+'º':'', t.nome||''].filter(Boolean).join(' '), t.etapa, t.turno].filter(Boolean).join(' · ');
function ordTurma(a,b){
  return (a.etapa||'').localeCompare(b.etapa||'','pt-BR')
      || String(a.serie||'').localeCompare(String(b.serie||''),'pt-BR',{numeric:true})
      || (a.turno||'').localeCompare(b.turno||'','pt-BR')
      || (a.nome||'').localeCompare(b.nome||'','pt-BR');
}
/* o acesso é por professor + turma + disciplina */
const chaveAcesso = (p,t,d)=> p+'::'+t+'::'+(d||'');
const acessoDe = (p,t,d)=> DB.acessos[chaveAcesso(p,t,d)] || null;
const temAcesso = (p,t,d)=> (acessoDe(p,t,d)||{}).status==='ativo';
/* acesso em qualquer disciplina — usado para a lista de alunos, que é da turma */
function temAcessoQualquer(p,t){
  return Object.keys(DB.acessos).some(k=>{
    const [pid,tid]=k.split('::');
    return pid===p && tid===t && DB.acessos[k].status==='ativo';
  });
}
function turmasDoProf(p, disc){
  return DB.turmas.filter(t=> disc ? temAcesso(p,t.id,disc) : temAcessoQualquer(p,t.id)).sort(ordTurma);
}
/* disciplinas em que o professor tem acesso àquela turma */
function discsNaTurma(p, turmaId){
  return discsDoProf(p).filter(d=>temAcesso(p,turmaId,d));
}
function partesAcesso(k){
  const partes = k.split('::');
  return {profId:partes[0], turmaId:partes[1], disc:partes.slice(2).join('::')};
}
const avaliacoesDoProf = (p,disc) => DB.avaliacoes.filter(a=>a.profId===p && avalDaDisc(a,disc));
const profPorId = id => DB.professores.find(p=>p.id===id) || null;
/* uma série é a combinação etapa + ano; as matérias são definidas por série */
const chaveSerie = t => (t.etapa||'')+'::'+(t.serie||'');
const rotuloSerie = k => { const [e,se]=k.split('::'); return [se?se+'º':'', e].filter(Boolean).join(' — '); };
const materiasDaSerie = k => (DB.catalogos.materias||{})[k] || [];
const materiasDaTurma = t => t ? materiasDaSerie(chaveSerie(t)) : [];
function seriesCadastradas(){
  const k={}; DB.turmas.forEach(t=>k[chaveSerie(t)]=1);

  return Object.keys(k).sort();
}
/* as disciplinas do professor são as matérias que a coordenação atribuiu a ele */
const discsDoProf = p => { const o = (typeof p==='string')?profPorId(p):p;
  if(!o) return [];
  const set={};
  Object.keys(DB.acessos||{}).forEach(k=>{
    const a=partesAcesso(k);
    if(a.profId===o.id && DB.acessos[k].status==='ativo' && a.disc) set[a.disc]=1;
  });
  const l=Object.keys(set).sort((x,y)=>x.localeCompare(y,'pt-BR'));
  if(l.length) return l;
  if(Array.isArray(o.disciplinas) && o.disciplinas.length) return o.disciplinas;
  return o.disciplina ? [o.disciplina] : []; };
const disciplinaDe = id => discsDoProf(id).join(' · ') || 'Sem disciplina';
/* disciplina em que o professor está trabalhando agora */
function discAtiva(){
  const eu = profAtual(); if(!eu) return '';
  const lista = discsDoProf(eu);
  if(!lista.length) return '';
  if(!ctx.disc || !lista.some(d=>normal(d)===normal(ctx.disc))) ctx.disc = lista[0];
  return ctx.disc;
}
const avalDaDisc = (a,disc)=> !disc || normal(a.disc||'')===normal(disc);
function calcDe(turmaId, profId, disc){
  const k = turmaId+'::'+profId+'::'+(disc||'');
  if(!DB.calculos[k]) DB.calculos[k] = {modo:'media', maxFinal:10, pesos:{}};
  return DB.calculos[k];
}
/* avaliações já aplicadas naquela turma */
function avaliacoesDaTurma(turmaId, profId, disc){
  return DB.avaliacoes.filter(a => (!profId || a.profId===profId) && avalDaDisc(a,disc)
    && DB.aplicacoes[chaveApl(turmaId,a.id)]);
}
/* pares professor + disciplina com alguma avaliação liberada para a turma */
function disciplinasDaTurma(turmaId){
  const vistos={}, pares=[];
  DB.avaliacoes.forEach(a=>{
    const ap = DB.aplicacoes[chaveApl(turmaId,a.id)];
    if(!ap || !ap.visivel) return;
    const prof = profPorId(a.profId); if(!prof) return;
    const disc = a.disc || (discsDoProf(prof)[0]||'');
    const k = a.profId+'::'+disc;
    if(vistos[k]) return; vistos[k]=1;
    pares.push({chave:k, prof, disc: disc||'Sem disciplina'});
  });
  return pares.sort((x,y)=>x.disc.localeCompare(y.disc,'pt-BR'));
}
function lanc(turmaId, avalId, alunoId, subId, criar){
  const a = apl(turmaId, avalId, criar); if(!a) return null;
  if(!a.notas[alunoId]){ if(!criar) return null; a.notas[alunoId]={}; }
  if(!a.notas[alunoId][subId]){ if(!criar) return null; a.notas[alunoId][subId]={}; }
  return a.notas[alunoId][subId];
}
/* cada sub-avaliação diz em quais turmas vale; sem lista, vale em todas (dados antigos) */
const subValeNa = (s, turmaId) => !Array.isArray(s.turmas) ? true : s.turmas.includes(turmaId);
const subsDaTurma = (a, turmaId) => (a.subs||[]).filter(s=>subValeNa(s, turmaId));
const turmasDaAval = a => {
  const ids={};
  (a.subs||[]).forEach(s=>{ if(Array.isArray(s.turmas)) s.turmas.forEach(t=>ids[t]=1); });
  return Object.keys(ids);
};
/* a folha de notas de uma turma existe enquanto houver parte dirigida a ela */
function ajustarAplicacoes(a){
  const alvo = turmasDaAval(a);
  alvo.forEach(tid=>{ if(DB.turmas.some(t=>t.id===tid)) apl(tid, a.id, true); });
  Object.keys(DB.aplicacoes).forEach(k=>{
    const [tid, aid] = k.split('::');
    if(aid!==a.id || alvo.includes(tid)) return;
    if(!Object.keys(DB.aplicacoes[k].notas||{}).length) delete DB.aplicacoes[k];
  });
}
const dataBR = d => d ? new Date(d+'T00:00').toLocaleDateString('pt-BR') : '';
function pesoTotal(sub){ return (sub.questoes||[]).reduce((s,q)=>s+num(q.peso,1),0) || 0; }

/* nota de uma sub-avaliação — null = sem lançamento */
function notaSub(sub, ent){
  if(!ent) return null;
  if(ent.faltou) return 0;
  const max = num(sub.max,0), min = num(sub.notaMin,0);
  if(sub.modo==='acertos'){
    const qs = sub.questoes||[]; const pt = pesoTotal(sub);
    let frac = null;
    if(Array.isArray(ent.q) && qs.length && pt>0){
      let obt=0; qs.forEach((q,i)=>{ if(ent.q[i]) obt+=num(q.peso,1); });
      frac = obt/pt;
    }else if(ent.nAcertos!==undefined && ent.nAcertos!==null && ent.nAcertos!=='' && qs.length){
      frac = Math.min(1, num(ent.nAcertos,0)/qs.length);
    }
    if(frac===null) return null;
    return min + frac*(max-min);
  }
  if(ent.pontos===undefined || ent.pontos===null || ent.pontos==='') return null;
  return num(ent.pontos,0);
}
/* nota da avaliação inteira para um aluno — null = sem lançamento */
function notaAval(aval, turmaId, alunoId){
  const a = apl(turmaId, aval.id); if(!a) return null;
  const subs = subsDaTurma(aval, turmaId); if(!subs.length) return null;
  const notas = subs.map(s=> notaSub(s, (a.notas[alunoId]||{})[s.id]));
  const dados = notas.map((n,i)=>({n, s:subs[i]})).filter(x=>x.n!==null);
  if(!dados.length) return null;
  if(aval.modoSub==='media'){
    const fr = dados.map(x=> num(x.s.max,0)>0 ? x.n/num(x.s.max,1) : 0);
    return (fr.reduce((s,v)=>s+v,0)/fr.length) * num(aval.max,10);
  }
  return dados.reduce((s,x)=>s+x.n,0);
}
/* nota final do aluno na turma, dentro de uma disciplina */
function notaFinal(turma, alunoId, profId, disc){
  const avs = avaliacoesDaTurma(turma.id, profId, disc);
  const calc = calcDe(turma.id, profId, disc);
  const itens = avs.map(av=>{
    const n = notaAval(av, turma.id, alunoId);
    return { av, n, frac: (n===null||num(av.max,0)<=0) ? null : n/num(av.max,1) };
  }).filter(i=>i.frac!==null);
  if(!itens.length) return {nota:null, max:num(calc.maxFinal,10), itens:[]};
  if(calc.modo==='pesos'){
    let soma=0;
    itens.forEach(i=> soma += i.frac * num((calc.pesos||{})[i.av.id], 0));
    return {nota:soma, max:num(calc.maxFinal,10), itens};
  }
  const m = itens.reduce((s,i)=>s+i.frac,0)/itens.length;
  return {nota: m*num(calc.maxFinal,10), max:num(calc.maxFinal,10), itens};
}
function somaSubs(aval){ return (aval.subs||[]).reduce((s,x)=>s+num(x.max,0),0); }

/* histórico */
function registrar(turmaId, alunoId, avalId, subId, antes, depois, obs){
  if(antes===depois) return;
  DB.historico.unshift({ts:Date.now(), turma:turmaId, aluno:alunoId, aval:avalId, sub:subId, antes, depois,
    obs:obs||'', autor:(profAtual()||{}).nome||''});
  if(DB.historico.length>4000) DB.historico.length=4000;
}

const nomeAluno = (tid,aid) => { const t=DB.turmas.find(x=>x.id===tid); if(!t) return '—'; const a=t.alunos.find(x=>x.id===aid); return a?a.nome:'—'; };
const nomeAval  = id => (DB.avaliacoes.find(a=>a.id===id)||{}).nome || '—';
function nomeSub(avalId, subId){

}

    nome=nome.replace(/^\s*\d+\s*[-–.)°º]?\s*/,'').replace(/^[-•*]\s*/,'').replace(/\s+/g,' ').trim();
    if(!nome) return false;
    if(t.alunos.some(a=>normal(a.nome)===normal(nome))) return false;
    t.alunos.push({id:uid(), nome, senha:'', resetLiberado:false}); return true;
  };
  if($('#addAluno')) $('#addAluno').onclick=()=>{
    if(!add($('#novoAluno').value)) return toast('Nome vazio ou já existente.');
    salvar(); render(); toast('Aluno adicionado.');
  };
  if($('#addLista')) $('#addLista').onclick=()=>{
    const linhas=$('#colaLista').value.split(/\r?\n/); let n=0;
    linhas.forEach(l=>{ if(add(l)) n++; });
    salvar(); render(); toast(n?`${n} aluno(s) adicionado(s).`:'Nenhum nome novo encontrado.');
  };
  $$('[data-pedir]').forEach(b=>b.onclick=()=>{
    const a=t.alunos.find(x=>x.id===b.dataset.pedir);
    const motivo = prompt(`Pedir ao gerenciador a exclusão de ${a.nome}.\nMotivo (opcional):`,'');
    if(motivo===null) return;
    DB.pedidos.unshift({id:uid(), tipo:'excluir-aluno', profId:(profAtual()||{}).id,
      turmaId:t.id, alunoId:a.id, nome:a.nome, motivo:motivo.trim(), status:'pendente', em:Date.now()});
    salvar(); render(); toast('Pedido enviado ao gerenciador.');
  });
  $$('[data-cancped]').forEach(b=>b.onclick=()=>{
    DB.pedidos=DB.pedidos.filter(x=>x.id!==b.dataset.cancped); salvar(); render(); toast('Pedido cancelado.');
  });
  $$('[data-senha]').forEach(b=>b.onclick=()=>{
    const a=t.alunos.find(x=>x.id===b.dataset.senha);
    abrirModal(`
      <h3>Senha de ${esc(a.nome)}</h3>
      <p style="color:var(--tinta-fraca);font-size:13.5px">A senha vale para todas as disciplinas. Fica guardada cifrada — nem você a lê.</p>

        <div class="acoes">
          <button class="btn" id="mDef">Definir senha</button>
          <button class="btn sec" id="mLib">${a.resetLiberado?'Cancelar liberação':'Liberar redefinição pelo aluno'}</button>
          <button class="btn sec" data-fechar>Fechar</button>
        </div>
      </div>`);
    $('#mDef').onclick=async()=>{
      const v=$('#msn').value; if(v.length<4) return toast('Use pelo menos 4 caracteres.');
      a.senha=await hash(v); a.resetLiberado=false; salvar(); fecharModal(); render(); toast('Senha definida.');
    };
    $('#mLib').onclick=()=>{ a.resetLiberado=!a.resetLiberado; salvar(); fecharModal(); render();
      toast(a.resetLiberado?'O aluno criará a senha no próximo acesso.':'Liberação cancelada.'); };
  });
}

    const img=new Image();
    img.onload=()=>{
      const M=1200, e=Math.min(1, M/Math.max(img.width,img.height));
      const cv=document.createElement('canvas');
      cv.width=Math.round(img.width*e); cv.height=Math.round(img.height*e);
      const cx=cv.getContext('2d'); cx.fillStyle='#fff'; cx.fillRect(0,0,cv.width,cv.height);
      cx.drawImage(img,0,0,cv.width,cv.height);
      cb(cv.toDataURL('image/jpeg',0.72));
    };
    img.onerror=()=>cb(null);
    img.src=fr.result;
  };
  fr.readAsDataURL(file);
}
function zonaColar(el, atual, onImg){
  const pinta = d => el.innerHTML = d
    ? `<img src="${d}" alt="Imagem anexada">
       <div style="margin-top:8px;font-size:12px">Clique aqui e cole (Ctrl+V) para trocar
       · <button class="btn min sec" data-arquivo>Escolher arquivo</button>
       · <button class="btn min perigo" data-limpar>Remover</button></div>`
    : `<strong>Clique aqui e cole a imagem</strong> (Ctrl+V) — ou arraste o arquivo
       <div style="margin-top:8px"><button class="btn min sec" data-arquivo>Escolher arquivo</button></div>`;
  pinta(atual);
  const usa = f => { if(!f) return; comprimir(f, d=>{ if(!d) return toast('Não consegui ler essa imagem.'); onImg(d); pinta(d); }); };
  el.tabIndex = 0;
  el.addEventListener('focus', ()=>{ el.style.borderColor='var(--azul)'; zonaAtiva=el; });
  el.addEventListener('blur',  ()=>{ el.style.borderColor=''; });
  el.addEventListener('click', e=>{
    if(e.target.hasAttribute('data-limpar')){ e.stopPropagation(); onImg(''); pinta(''); return; }
    if(e.target.hasAttribute('data-arquivo')){
      e.stopPropagation();
      const inp=document.createElement('input'); inp.type='file'; inp.accept='image/*';
      inp.onchange=()=>usa(inp.files[0]); inp.click(); return;
    }
    el.focus();
  });
  const colar = e=>{
    const it=[...((e.clipboardData||{}).items||[])].find(i=>i.type.startsWith('image/'));
    if(it){ e.preventDefault(); usa(it.getAsFile()); }
  };
  el.addEventListener('paste', colar);
  el._colar = colar;
  el.addEventListener('dragover', e=>{e.preventDefault(); el.style.borderColor='var(--azul)';});
  el.addEventListener('dragleave', ()=>el.style.borderColor='');
  el.addEventListener('drop', e=>{ e.preventDefault(); el.style.borderColor=''; usa(e.dataTransfer.files[0]); });
}
var zonaAtiva = null;
document.addEventListener('paste', e=>{
  const alvo=document.activeElement;
  if(alvo && (alvo.tagName==='INPUT'||alvo.tagName==='TEXTAREA')) return;
  if(zonaAtiva && document.body.contains(zonaAtiva) && zonaAtiva._colar) zonaAtiva._colar(e);
});

    c.subs.forEach(s=>{ s.id=uid(); (s.questoes||[]).forEach(q=>q.id=uid()); });

function editorAval(a){

    : `<div class="aviso">Cada parte é convertida em porcentagem, a média das partes lançadas é tirada e multiplicada por ${fmt(a.max)}. As pontuações máximas das partes podem ser diferentes entre si.</div>`;

/* em quais turmas esta parte foi aplicada */
function turmasDaSub(s){

function cardSub(a,s,i){
  const qs=s.questoes||[];

        <button class="btn min sec" data-subup="${s.id}">↑</button>
        <button class="btn min sec" data-subdown="${s.id}">↓</button>

      </div>

      <button data-modo="acertos" class="${s.modo==='acertos'?'on':''}">Calcular por acertos</button>

      <div class="linha" style="margin-bottom:10px">

          <input type="number" min="0" step="1" data-nq value="${qs.length}"></div>
        <div class="campo" style="flex:0 1 150px"><label>Nota mínima (com 0 acerto)</label>
          <input type="number" step="0.01" data-f="notaMin" value="${s.notaMin}"></div>

          0 acerto → ${fmt(s.notaMin)} · todos os acertos → ${fmt(s.max)}. O que está no meio é proporcional ao peso das questões.</div></div>

                ${LETRAS.map(l=>`<option ${q.gab===l?'selected':''}>${l}</option>`).join('')}

function ligarEditorAval(a){
  const g=(sel)=>$(sel);
  ['nome','max','desc'].forEach(()=>{});
  g('#av_nome').oninput=e=>{ a.nome=e.target.value; salvar(); };
  g('#av_max').onchange=e=>{ a.max=num(e.target.value,0); salvar(); render(); };
  g('#av_desc').oninput=e=>{ a.descricao=e.target.value; salvar(); };
  $$('[data-modosub]').forEach(b=>b.onclick=()=>{ a.modoSub=b.dataset.modosub; salvar(); render(); });
  $('#addSub').onclick=()=>{ a.subs.push(novaSub('Parte '+(a.subs.length+1))); ajustarAplicacoes(a); salvar(); render(); };
  $$('[data-subturma]').forEach(b=>b.onclick=()=>{
    const [sid,tid]=b.dataset.subturma.split('::');
    const sub=a.subs.find(x=>x.id===sid); if(!sub) return;
    if(!Array.isArray(sub.turmas)) sub.turmas = turmasDoProf((profAtual()||{}).id, discAtiva()).map(t=>t.id);
    const dentro = sub.turmas.includes(tid);
    if(dentro){
      const A=apl(tid,a.id);
      const comNota = A ? Object.values(A.notas||{}).filter(n=>n[sid]!==undefined).length : 0;
      if(comNota && !confirm(`${comNota} aluno(s) já têm pontuação nesta parte em ${rotuloTurma(DB.turmas.find(t=>t.id===tid))}. Retirar apaga esses lançamentos. Continuar?`)) return;
      if(comNota && A) Object.values(A.notas).forEach(n=>{ delete n[sid]; });
      sub.turmas = sub.turmas.filter(x=>x!==tid);
    }else{
      sub.turmas = [...sub.turmas, tid];
    }
    ajustarAplicacoes(a); salvar(); render();
  });

  $$('.subcard').forEach(card=>{
    const s=a.subs.find(x=>x.id===card.dataset.sub); if(!s) return;
    $$('[data-f]',card).forEach(inp=>{
      const f=inp.dataset.f, numerico = (f==='max'||f==='notaMin');
      const aplica = e=>{ s[f]= numerico ? num(e.target.value,0) : e.target.value; salvar(); };
      if(numerico) inp.onchange=e=>{ aplica(e); render(); };
      else inp.oninput=aplica;
    });
    $$('[data-modo]',card).forEach(b=>b.onclick=()=>{
      s.modo=b.dataset.modo;
      if(s.modo==='acertos' && !(s.questoes||[]).length) s.questoes=[];
      salvar(); render();
    });
    const nq=$('[data-nq]',card);
    if(nq) nq.onchange=()=>{
      const n=Math.max(0,Math.round(num(nq.value,0)));
      const q=s.questoes||[];
      while(q.length<n) q.push({id:uid(), peso:1, gab:''});
      q.length=n; s.questoes=q; ctx.abrirQ=s.id; salvar(); render();
    };
    $$('[data-qpeso]',card).forEach(inp=>inp.oninput=()=>{
      const q=s.questoes.find(x=>x.id===inp.dataset.qpeso); q.peso=num(inp.value,1); salvar();
    });
    $$('[data-qgab]',card).forEach(sel=>sel.onchange=()=>{
      const q=s.questoes.find(x=>x.id===sel.dataset.qgab); q.gab=sel.value; salvar();
    });
    const p1=$('[data-pesos1]',card);
    if(p1) p1.onclick=()=>{ s.questoes.forEach(q=>q.peso=1); ctx.abrirQ=s.id; salvar(); render(); };
    $$('[data-subup]',card).forEach(b=>b.onclick=()=>{
      const i=a.subs.indexOf(s); if(i>0){ a.subs.splice(i-1,0,a.subs.splice(i,1)[0]); salvar(); render(); }});
    $$('[data-subdown]',card).forEach(b=>b.onclick=()=>{
      const i=a.subs.indexOf(s); if(i<a.subs.length-1){ a.subs.splice(i+1,0,a.subs.splice(i,1)[0]); salvar(); render(); }});
    $$('[data-subdel]',card).forEach(b=>b.onclick=()=>{
      if(!confirm(`Excluir a parte "${s.nome}" e suas pontuações?`)) return;
      a.subs=a.subs.filter(x=>x.id!==s.id); ajustarAplicacoes(a); salvar(); render(); });
    $$('[data-img]',card).forEach(z=>{
      const [tipo,sid]=z.dataset.img.split('::');
      const campo = tipo==='atividade'?'imagem':'gabImagem';
      zonaColar(z, s[campo], d=>{ s[campo]=d; ctx.abrirAnexo=sid; salvar(); });
    });
  });
}

<script>
/* =======================================================================
   04 · LANÇAR NOTAS
   ======================================================================= */
const JUSTIFICATIVAS = ['Sem visto','Incompleta','Fora do prazo','Resposta mal elaborada','Resposta incorreta','Justificado'];

function seletorTurmaAval(){
  const eu = profAtual() || {};
  const turmas = turmasDoProf(eu.id, discAtiva());
  const avs = avaliacoesDoProf(eu.id, discAtiva());
  return `
  <div class="linha" style="margin-bottom:4px">
    <div class="campo"><label>Turma</label><select id="selTurma">
      <option value="">Selecione…</option>
      ${turmas.map(t=>`<option value="${t.id}" ${ctx.turma===t.id?'selected':''}>${esc(rotuloTurma(t))}</option>`).join('')}
    </select></div>
    <div class="campo"><label>Avaliação</label><select id="selAval">
      <option value="">Selecione…</option>
      ${avs.map(a=>`<option value="${a.id}" ${ctx.aval===a.id?'selected':''}>${esc(a.nome)}</option>`).join('')}
    </select></div>
  </div>
  ${!turmas.length?'<div class="aviso">Nenhuma turma liberada para você ainda. Peça acesso em “Minhas turmas”.</div>':''}`;
}

function vLancamento(alvo){
  const eu = profAtual() || {};
  const t=DB.turmas.find(x=>x.id===ctx.turma && temAcesso(eu.id,x.id,discAtiva()));
  const a=DB.avaliacoes.find(x=>x.id===ctx.aval && x.profId===eu.id && avalDaDisc(x,discAtiva()));
  let corpo='', temTabela=false;
  if(!t||!a){
    corpo = `<div class="vazio"><strong>Escolha a turma e a avaliação</strong>A tabela de lançamento aparece aqui.</div>`;
  }else if(!t.alunos.length){
    corpo = `<div class="vazio"><strong>${esc(rotuloTurma(t))} está sem alunos</strong>Cadastre a lista em “Minhas turmas”.</div>`;
  }else if(!(a.subs||[]).length){
    corpo = `<div class="vazio"><strong>${esc(a.nome)} não tem partes</strong>Crie ao menos uma sub-avaliação em “Avaliações”.</div>`;
  }else if(!subsDaTurma(a,t.id).length){
    corpo = `<div class="vazio"><strong>Nenhuma parte de “${esc(a.nome)}” foi aplicada em ${esc(rotuloTurma(t))}</strong>
      Em “Avaliações”, marque esta turma nas partes que valem para ela.</div>`;
  }else{
    apl(t.id,a.id,true);
    corpo = tabelaLancamento(t,a);
    temTabela = true;
  }
  alvo.innerHTML = `
  <div class="cabeca">
    <div><h2>Lançar notas</h2><div class="sub">Lançamento em tabela, com cálculo automático a cada digitação.</div></div>
  </div>
  <div class="painel">${seletorTurmaAval()}</div>
  ${corpo}`;

  $('#selTurma').onchange=e=>{ ctx.turma=e.target.value; render(); };
  $('#selAval').onchange=e=>{ ctx.aval=e.target.value; render(); };
  if(temTabela) ligarTabela(t,a);
}

function tabelaLancamento(t,a){
  const A=apl(t.id,a.id);
  const subs=subsDaTurma(a,t.id);
  const alunos=[...t.alunos].sort(ordAlfa);
  const ordem = ctx.ordem||'alfa';
  let linhas = alunos.map((al,i)=>({al, pos:i+1, nota:notaAval(a,t.id,al.id)}));
  if(ordem==='maior') linhas=[...linhas].sort((x,y)=>(y.nota??-1)-(x.nota??-1));
  if(ordem==='menor') linhas=[...linhas].sort((x,y)=>(x.nota??1e9)-(y.nota??1e9));
  const lancadas = linhas.filter(l=>l.nota!==null);
  const media = lancadas.length? lancadas.reduce((s,l)=>s+l.nota,0)/lancadas.length : null;

  return `
  <div class="faixa-visib ${A.visivel?'on':''}">
    <div style="display:flex;align-items:center;gap:18px;flex-wrap:wrap">
      <div class="carimbo ${A.visivel?'liberado':''}">
        ${A.visivel?'Notas liberadas':'Notas fechadas'}
        <small>${A.visivel? (A.liberadoEm?dataHora(A.liberadoEm):'visíveis para a turma') : 'só o professor vê'}</small>
      </div>
      <div class="txt">
        <strong>${A.visivel?'A turma já está vendo estas notas':'A turma ainda não vê estas notas'}</strong>
        <span>${esc(a.nome)} · ${esc(rotuloTurma(t))} · vale ${fmt(a.max)}${media!==null?` · média da turma ${fmt(media)}`:''}</span>
      </div>
    </div>
    <button class="btn ${A.visivel?'perigo':''}" id="togVis">${A.visivel?'Fechar para a turma':'Liberar para a turma'}</button>
  </div>

  <div class="painel">
    <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px">
      <div>
        <h3>${esc(a.nome)}</h3>
        <p class="desc">${subs.length} parte(s) nesta turma · ${a.modoSub==='media'?'nota = média das partes lançadas, na escala de '+fmt(a.max):'nota = soma das partes'}</p>
      </div>
      <div class="escolhas" style="align-items:center">
        <button data-ord="alfa" class="${ordem==='alfa'?'on':''}">Ordem alfabética</button>
        <button data-ord="maior" class="${ordem==='maior'?'on':''}">Maior nota</button>
        <button data-ord="menor" class="${ordem==='menor'?'on':''}">Menor nota</button>
      </div>
    </div>
    <div class="rolagem"><table class="pauta">
      <thead><tr>
        <th class="ord">Nº</th><th>Aluno</th>
        ${subs.map(s=>{const dt=s.data;return `<th>${esc(s.nome||'—')}<br><span style="font-weight:400;text-transform:none;letter-spacing:0">${s.modo==='acertos'?`acertos de ${(s.questoes||[]).length} · vale ${fmt(s.max)}`:`vale ${fmt(s.max)}`}${dt?` · ${dataBR(dt)}`:''}</span></th>`;}).join('')}
        <th style="text-align:right">Nota da avaliação</th>
      </tr></thead>
      <tbody>${linhas.map(l=>`
        <tr data-aluno="${l.al.id}">
          <td class="ord">${l.pos}</td>
          <td class="nome">${esc(l.al.nome)}</td>
          ${subs.map(s=>celula(t,a,s,l.al)).join('')}
          <td class="final">${l.nota===null?'<span style="color:var(--tinta-fraca);font-weight:400">—</span>':fmt(l.nota)}</td>
        </tr>`).join('')}</tbody>
    </table></div>
    <div class="aviso" style="margin-top:14px">
      <strong>MÁX · MÉD · MÍN</strong> preenchem a pontuação cheia, a metade e o piso com um toque.
      <strong>F</strong> marca falta e zera a pontuação. <strong>!</strong> abre a justificativa daquela nota — opcional, e o aluno vê junto com a nota.
    </div>
  </div>`;
}

/* pontuação cheia, metade e piso de uma parte */
function atalhoValor(s, qual){
  if(s.modo==='acertos'){
    const q=(s.questoes||[]).length;
    if(!q) return null;
    return qual==='max'? q : qual==='min'? 0 : Math.round(q/2);
  }
  const mx=num(s.max,0);
  return qual==='max'? mx : qual==='min'? 0 : Math.round((mx/2)*100)/100;
}

function celula(t,a,s,al){
  const e = lanc(t.id,a.id,al.id,s.id) || {};
  const faltou = !!e.faltou;
  const valor = s.modo==='acertos' ? (e.nAcertos??'') : (e.pontos??'');
  const n = notaSub(s,e);
  const temJ = !!(e.just&&e.just.length);
  return `<td class="${faltou?'faltou':''}">
    <div style="display:flex;align-items:center;gap:4px">
      <input type="number" step="0.01" min="0" data-cel="${s.id}" value="${valor}" ${faltou?'disabled':''}
        placeholder="${s.modo==='acertos'?'ac.':'pts'}" title="${s.modo==='acertos'?'Quantidade de acertos':'Pontuação obtida'}">
      <button class="btn min ${faltou?'perigo':'sec'}" data-falta="${s.id}" title="Faltou">F</button>
      <button class="marca-just" data-just="${s.id}" title="${temJ?esc(e.just):'Justificativa'}" style="color:${temJ?'var(--ambar)':'var(--pauta)'}">!</button>
      ${s.modo==='acertos'&&(s.questoes||[]).length?`<button class="btn min sec" data-quest="${s.id}" title="Marcar questão por questão">Q</button>`:''}
    </div>
    ${atalhoValor(s,'max')!==null?`<div class="atalhos">
      <button class="btn mini sec" data-atalho="${s.id}::max" title="${s.modo==='acertos'?`Todos os ${(s.questoes||[]).length} acertos`:`Pontuação cheia (${fmt(s.max)})`}">MÁX</button>
      <button class="btn mini sec" data-atalho="${s.id}::med" title="Metade da pontuação">MÉD</button>
      <button class="btn mini sec" data-atalho="${s.id}::min" title="${s.modo==='acertos'?'Nenhum acerto':'Zero'}">MÍN</button>
    </div>`:''}
    ${s.modo==='acertos'&&n!==null?`<div class="pill" style="margin-top:2px">${fmt(n)} pts</div>`:''}
  </td>`;
}

function ligarTabela(t,a){
  const A=apl(t.id,a.id);
  const subs=subsDaTurma(a,t.id);
  $('#togVis').onclick=()=>{
    A.visivel=!A.visivel; A.liberadoEm = A.visivel?Date.now():null;
    registrar(t.id,'','','', A.visivel?'fechada':'liberada', A.visivel?'liberada':'fechada', 'Visibilidade de '+a.nome);
    salvar(); render(); toast(A.visivel?'Notas liberadas para a turma.':'Notas fechadas.');
  };
  $$('[data-ord]').forEach(b=>b.onclick=()=>{ ctx.ordem=b.dataset.ord; render(); });

  $$('tr[data-aluno]').forEach(tr=>{
    const alunoId=tr.dataset.aluno;
    $$('[data-cel]',tr).forEach(inp=>inp.onchange=()=>{
      const s=subs.find(x=>x.id===inp.dataset.cel);
      const e=lanc(t.id,a.id,alunoId,s.id,true);
      const antes=notaSub(s,e);
      if(s.modo==='acertos'){
        const v=inp.value===''?null:Math.min((s.questoes||[]).length||1e9, Math.max(0,num(inp.value,0)));
        e.nAcertos=v; delete e.q;
        if(v!==null) inp.value=v;
      }else{
        e.pontos = inp.value===''?null:Math.min(num(s.max,1e9), Math.max(0,num(inp.value,0)));
        if(e.pontos!==null) inp.value=e.pontos;
      }
      registrar(t.id,alunoId,a.id,s.id, antes===null?'—':fmt(antes), fmt(notaSub(s,e)));
      salvar(); atualizarLinha(tr,t,a,alunoId);
    });
    $$('[data-cel]',tr).forEach(inp=>inp.onkeydown=ev=>{
      if(ev.key!=='Enter') return;
      ev.preventDefault(); inp.blur();
      const prox=tr.nextElementSibling;
      if(prox){ const alvo=$(`[data-cel="${inp.dataset.cel}"]`,prox); if(alvo){ alvo.focus(); alvo.select(); } }
    });
    $$('[data-falta]',tr).forEach(b=>b.onclick=()=>{
      const s=subs.find(x=>x.id===b.dataset.falta);
      const e=lanc(t.id,a.id,alunoId,s.id,true);
      const antes=notaSub(s,e); e.faltou=!e.faltou;
      registrar(t.id,alunoId,a.id,s.id, antes===null?'—':fmt(antes), e.faltou?'faltou (0)':fmt(notaSub(s,e)));
      salvar(); render();
    });
    $$('[data-atalho]',tr).forEach(b=>b.onclick=()=>{
      const [sid,qual]=b.dataset.atalho.split('::');
      const s=subs.find(x=>x.id===sid); if(!s) return;
      const e=lanc(t.id,a.id,alunoId,s.id,true);
      const antes=notaSub(s,e);
      const v=atalhoValor(s,qual);
      e.faltou=false;
      if(s.modo==='acertos'){ e.nAcertos=v; delete e.q; } else { e.pontos=v; }
      registrar(t.id,alunoId,a.id,s.id, antes===null?'—':fmt(antes), fmt(notaSub(s,e)));
      salvar();
      const campo=$(`[data-cel="${sid}"]`,tr);
      if(campo){ campo.disabled=false; campo.value=v; }
      atualizarLinha(tr,t,a,alunoId);
    });
    $$('[data-just]',tr).forEach(b=>b.onclick=()=>modalJustificativa(t,a,subs.find(x=>x.id===b.dataset.just),alunoId));
    $$('[data-quest]',tr).forEach(b=>b.onclick=()=>modalQuestoes(t,a,subs.find(x=>x.id===b.dataset.quest),alunoId));
  });
}

/* recalcula só a linha alterada — mantém o foco para digitação em sequência */
function atualizarLinha(tr,t,a,alunoId){
  subsDaTurma(a,t.id).forEach(s=>{
    const cel=$(`[data-cel="${s.id}"]`,tr); if(!cel) return;
    const td=cel.closest('td'); const e=lanc(t.id,a.id,alunoId,s.id)||{};
    const n=notaSub(s,e);
    td.classList.toggle('faltou', !!e.faltou);
    const pill=$('.pill',td);
    if(s.modo==='acertos'){
      if(n!==null&&!pill){ td.insertAdjacentHTML('beforeend',`<div class="pill">${fmt(n)} pts</div>`); }
      else if(n!==null){ pill.textContent=fmt(n)+' pts'; }
      else if(pill){ pill.remove(); }
    }
    const bj=$('[data-just]',td);
    if(bj) bj.style.color = (e.just&&e.just.length)?'var(--ambar)':'var(--pauta)';
  });
  const total=notaAval(a,t.id,alunoId);
  const tdFinal=tr.lastElementChild;
  tdFinal.innerHTML = total===null?'<span style="color:var(--tinta-fraca);font-weight:400">—</span>':fmt(total);
}

function modalJustificativa(t,a,s,alunoId){
  const e=lanc(t.id,a.id,alunoId,s.id,true);
  abrirModal(`
    <h3>Justificativa</h3>
    <p style="color:var(--tinta-fraca);font-size:13.5px">${esc(nomeAluno(t.id,alunoId))} · ${esc(s.nome)} · ${esc(a.nome)}</p>
    <div class="escolhas" style="margin:12px 0">
      ${JUSTIFICATIVAS.map(j=>`<button data-j="${esc(j)}" class="${e.just===j?'on':''}">${j}</button>`).join('')}
    </div>
    <label>Justificativa personalizada</label>
    <textarea id="jTxt" placeholder="Opcional — o aluno lê este texto junto da nota.">${esc(e.just&&!JUSTIFICATIVAS.includes(e.just)?e.just:'')}</textarea>
    <div class="acoes" style="margin-top:12px">
      <button class="btn" id="jOk">Salvar justificativa</button>
      <button class="btn sec" id="jLimpar">Remover</button>
      <button class="btn sec" data-fechar>Cancelar</button>
    </div>`);
  let escolha = JUSTIFICATIVAS.includes(e.just)?e.just:'';
  $$('[data-j]').forEach(b=>b.onclick=()=>{
    escolha = escolha===b.dataset.j?'':b.dataset.j;
    $$('[data-j]').forEach(x=>x.classList.toggle('on', x.dataset.j===escolha));
  });
  $('#jOk').onclick=()=>{
    const livre=$('#jTxt').value.trim();
    e.just = livre || escolha || '';
    registrar(t.id,alunoId,a.id,s.id,'justificativa', e.just||'(removida)');
    salvar(); fecharModal();
    const tr=$(`tr[data-aluno="${alunoId}"]`); if(tr) atualizarLinha(tr,t,a,alunoId);
    toast('Justificativa salva.');
  };
  $('#jLimpar').onclick=()=>{ e.just=''; salvar(); fecharModal();
    const tr=$(`tr[data-aluno="${alunoId}"]`); if(tr) atualizarLinha(tr,t,a,alunoId); };
}

function modalQuestoes(t,a,s,alunoId){
  const e=lanc(t.id,a.id,alunoId,s.id,true);
  const qs=s.questoes||[];
  if(!Array.isArray(e.q)){
    const n=num(e.nAcertos,0);
    e.q = qs.map((_,i)=> i<n);
  }
  const pinta=()=>{
    const obt=qs.reduce((x,q,i)=> x + (e.q[i]?num(q.peso,1):0),0);
    const pt=pesoTotal(s)||1;
    const nota=num(s.notaMin,0) + (obt/pt)*(num(s.max,0)-num(s.notaMin,0));
    $('#qres').innerHTML = `${e.q.filter(Boolean).length} de ${qs.length} questões · peso ${fmt(obt)} de ${fmt(pt)} · <strong>${fmt(nota)} pontos</strong>`;
  };
  abrirModal(`
    <h3>Marcar acertos</h3>
    <p style="color:var(--tinta-fraca);font-size:13.5px">${esc(nomeAluno(t.id,alunoId))} · ${esc(s.nome)}. Clique nas questões que o aluno acertou.</p>
    <div class="qgrade" style="margin:12px 0">
      ${qs.map((q,i)=>`<button class="qitem" data-q="${i}" style="cursor:pointer;text-align:left;width:100%">
        <div class="qn">Questão ${i+1}${q.gab?' · gab. '+q.gab:''}</div>
        <div style="font-weight:600" data-lab="${i}">${e.q[i]?'Acertou':'Errou'} · peso ${fmt(q.peso,1)}</div>
      </button>`).join('')}
    </div>
    <div class="aviso bom" id="qres"></div>
    <div class="acoes" style="margin-top:12px">
      <button class="btn" id="qOk">Salvar</button>
      <button class="btn sec" id="qTodas">Marcar todas</button>
      <button class="btn sec" id="qNenhuma">Desmarcar todas</button>
      <button class="btn sec" data-fechar>Cancelar</button>
    </div>`);
  const atualiza=()=>{ qs.forEach((q,i)=>{ const l=$(`[data-lab="${i}"]`); l.textContent=(e.q[i]?'Acertou':'Errou')+' · peso '+fmt(q.peso,1);
    l.parentElement.style.background = e.q[i]?'#EAF3EE':'#fff'; }); pinta(); };
  $$('[data-q]').forEach(b=>b.onclick=()=>{ const i=+b.dataset.q; e.q[i]=!e.q[i]; atualiza(); });
  $('#qTodas').onclick=()=>{ e.q=qs.map(()=>true); atualiza(); };
  $('#qNenhuma').onclick=()=>{ e.q=qs.map(()=>false); atualiza(); };
  $('#qOk').onclick=()=>{
    e.nAcertos=e.q.filter(Boolean).length;
    registrar(t.id,alunoId,a.id,s.id,'questões', fmt(notaSub(s,e)));
    salvar(); fecharModal(); render(); toast('Acertos salvos.'); ctx.foco=null;
  };
  atualiza();
}

/* =======================================================================
   05 · NOTA FINAL
   ======================================================================= */
function vFechamento(alvo){
  const eu = profAtual() || {};
  const turmas = turmasDoProf(eu.id, discAtiva());
  const t = turmas.find(x=>x.id===ctx.turma);
  let corpo='';
  if(!t){ corpo=`<div class="vazio"><strong>Escolha uma turma</strong>O fechamento é definido turma a turma.</div>`; }
  else{
    const c=calcDe(t.id, eu.id, discAtiva()), avs=avaliacoesDaTurma(t.id, eu.id, discAtiva());
    const somaPesos = avs.reduce((s,a)=>s+num((c.pesos||{})[a.id],0),0);
    const alunos=[...t.alunos].sort(ordAlfa);
    let linhas=alunos.map((al,i)=>({al,pos:i+1,r:notaFinal(t,al.id,eu.id,discAtiva())}));
    const ordem=ctx.ordemF||'alfa';
    if(ordem==='maior') linhas=[...linhas].sort((x,y)=>(y.r.nota??-1)-(x.r.nota??-1));
    if(ordem==='menor') linhas=[...linhas].sort((x,y)=>(x.r.nota??1e9)-(y.r.nota??1e9));

    corpo=`
    <div class="painel">
      <h3>Como a nota final é calculada</h3>
      <p class="desc">Vale para ${esc(rotuloTurma(t))} em ${esc(discAtiva()||'sua disciplina')}.</p>
      <div class="escolhas" style="margin-bottom:12px">
        <button data-modof="media" class="${c.modo==='media'?'on':''}">Média das avaliações</button>
        <button data-modof="pesos" class="${c.modo==='pesos'?'on':''}">Valor fixo por avaliação</button>
      </div>
      <div class="linha" style="margin-bottom:12px">
        <div class="campo" style="flex:0 1 160px"><label>Nota final máxima</label><input type="number" step="0.01" id="maxFinal" value="${c.maxFinal}"></div>
      </div>
      ${c.modo==='media'
        ? `<div class="aviso">Cada avaliação é convertida em porcentagem do seu próprio valor e todas pesam igual, independentemente de valerem 10, 20 ou 4 pontos. A média das porcentagens é multiplicada por ${fmt(c.maxFinal)}.</div>`
        : `<div class="aviso ${Math.abs(somaPesos-num(c.maxFinal,10))<0.001?'bom':'erro'}">Os valores somam ${fmt(somaPesos)} de ${fmt(c.maxFinal)}. Cada avaliação entrega no máximo o valor definido abaixo.</div>
          ${avs.length?`<div class="grade">${avs.map(a=>`
            <div><label>${esc(a.nome)} — vale até</label><input type="number" step="0.01" data-peso="${a.id}" value="${num((c.pesos||{})[a.id],0)}"></div>`).join('')}</div>`:''}`}
      ${!avs.length?`<div class="vazio" style="margin-top:12px"><strong>Nenhuma avaliação sua aplicada nesta turma</strong>Aplique avaliações em “Lançar notas”.</div>`:''}
    </div>
    ${avs.length?`
    <div class="painel">
      <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px">
        <div><h3>Quadro de notas finais</h3><p class="desc">Só entram no cálculo as avaliações com nota lançada.</p></div>
        <div class="escolhas">
          <button data-ordf="alfa" class="${ordem==='alfa'?'on':''}">Ordem alfabética</button>
          <button data-ordf="maior" class="${ordem==='maior'?'on':''}">Maior nota</button>
          <button data-ordf="menor" class="${ordem==='menor'?'on':''}">Menor nota</button>
        </div>
      </div>
      <div class="rolagem"><table class="pauta">
        <thead><tr><th class="ord">Nº</th><th>Aluno</th>
          ${avs.map(a=>`<th style="text-align:right">${esc(a.nome)}<br><span style="font-weight:400;text-transform:none">de ${fmt(a.max)}</span></th>`).join('')}
          <th style="text-align:right">Nota final</th></tr></thead>
        <tbody>${linhas.map(l=>`<tr>
          <td class="ord">${l.pos}</td><td class="nome">${esc(l.al.nome)}</td>
          ${avs.map(a=>{const n=notaAval(a,t.id,l.al.id);return `<td class="num" style="text-align:right">${n===null?'—':fmt(n)}</td>`;}).join('')}
          <td class="final">${l.r.nota===null?'—':fmt(l.r.nota)}</td></tr>`).join('')}</tbody>
      </table></div>
    </div>`:''}`;
  }
  alvo.innerHTML=`
  <div class="cabeca"><div><h2>Nota final</h2><div class="sub">O peso de cada avaliação no resultado do período.</div></div></div>
  <div class="painel"><div class="linha"><div class="campo"><label>Turma</label><select id="selTurmaF">
    <option value="">Selecione…</option>
    ${turmas.map(x=>`<option value="${x.id}" ${ctx.turma===x.id?'selected':''}>${esc(rotuloTurma(x))}</option>`).join('')}
  </select></div></div></div>
  ${corpo}`;
  $('#selTurmaF').onchange=e=>{ ctx.turma=e.target.value; render(); };
  if(!t) return;
  const cc = calcDe(t.id, eu.id, discAtiva());
  $$('[data-modof]').forEach(b=>b.onclick=()=>{ cc.modo=b.dataset.modof; salvar(); render(); });
  $('#maxFinal').onchange=e=>{ cc.maxFinal=num(e.target.value,10); salvar(); render(); };
  $$('[data-peso]').forEach(inp=>inp.onchange=()=>{
    cc.pesos=cc.pesos||{}; cc.pesos[inp.dataset.peso]=num(inp.value,0); salvar(); render(); });
  $$('[data-ordf]').forEach(b=>b.onclick=()=>{ ctx.ordemF=b.dataset.ordf; render(); });
}
</script>
<script>
/* =======================================================================
   06 · HISTÓRICO
   ======================================================================= */
function vHistorico(alvo){
  const turmas = turmasDoProf((profAtual()||{}).id);   // histórico cobre todas as disciplinas
  const t=DB.turmas.find(x=>x.id===ctx.hTurma);
  let itens=DB.historico;
  if(ctx.hTurma) itens=itens.filter(h=>h.turma===ctx.hTurma);
  if(ctx.hAluno) itens=itens.filter(h=>h.aluno===ctx.hAluno);
  const mostra=itens.slice(0,400);
  alvo.innerHTML=`
  <div class="cabeca"><div><h2>Histórico</h2><div class="sub">Dia e hora de cada alteração de nota, por turma e por aluno.</div></div>
    <button class="btn sec" id="limparHist">Limpar histórico</button></div>
  <div class="painel">
    <div class="linha">
      <div class="campo"><label>Turma</label><select id="hT"><option value="">Todas</option>
        ${turmas.map(x=>`<option value="${x.id}" ${ctx.hTurma===x.id?'selected':''}>${esc(rotuloTurma(x))}</option>`).join('')}</select></div>
      <div class="campo"><label>Aluno</label><select id="hA"><option value="">Todos</option>
        ${t?[...t.alunos].sort(ordAlfa).map(a=>`<option value="${a.id}" ${ctx.hAluno===a.id?'selected':''}>${esc(a.nome)}</option>`).join(''):''}</select></div>
    </div>
  </div>
  <div class="painel">
    ${mostra.length?`<div class="rolagem"><table class="pauta">
      <thead><tr><th>Quando</th><th>Turma</th><th>Aluno</th><th>Avaliação</th><th>Parte</th><th>De</th><th>Para</th><th>Por</th></tr></thead>
      <tbody>${mostra.map(h=>`<tr>
        <td class="num" style="white-space:nowrap">${dataHora(h.ts)}</td>
        <td>${esc(nomeTurma(h.turma))}</td>
        <td>${h.aluno?esc(nomeAluno(h.turma,h.aluno)):'<span style="color:var(--tinta-fraca)">—</span>'}</td>

function montarImpressao(t){
  const c=DB.capa, eu=profAtual()||{};
  const avs=avaliacoesDaTurma(t.id, eu.id, discAtiva()).filter(a=>ctx.imp[a.id]!==false);
  const alunos=[...t.alunos].sort(ordAlfa);
  const cols=[];
  avs.forEach(a=>{
    if(ctx.impSubs) subsDaTurma(a,t.id).forEach(s=>{
      const dt=s.data;
      cols.push({tipo:'sub', a, s, rot:`${a.nome} · ${s.nome||'—'}${dt?' ('+dataBR(dt)+')':''}`, max:s.max});
    });
    cols.push({tipo:'aval', a, rot:a.nome, max:a.max});
  });
  return `
  <div style="margin-bottom:14px">
    <div style="font-family:var(--display);font-size:20px;font-weight:700">${esc(c.instituicao||'Relação de notas')}</div>
    <div style="font-size:14px">${esc(discAtiva()||'')}${eu.nome?' — '+esc(eu.nome):''}</div>
    <div style="font-size:13px;color:var(--tinta-fraca)">Turma ${esc(rotuloTurma(t))} · ${esc([c.periodo&&c.periodo+'º',c.tipoPeriodo,c.ano].filter(Boolean).join(' '))} · emitida em ${new Date().toLocaleDateString('pt-BR')}</div>
  </div>
  <table class="pauta">
    <thead><tr><th class="ord">Nº</th><th>Aluno</th>
      ${cols.map(k=>`<th style="text-align:right">${esc(k.rot)}<br><span style="font-weight:400;text-transform:none">${fmt(k.max)}</span></th>`).join('')}
      ${ctx.impFinal!==false?'<th style="text-align:right">Final</th>':''}
      ${ctx.impAss?'<th style="width:22%">Assinatura</th>':''}</tr></thead>
    <tbody>${alunos.map((al,i)=>`<tr><td class="ord">${i+1}</td><td class="nome">${esc(al.nome)}</td>
      ${cols.map(k=>{
        const v = k.tipo==='sub' ? notaSub(k.s, lanc(t.id,k.a.id,al.id,k.s.id)) : notaAval(k.a,t.id,al.id);
        return `<td class="num" style="text-align:right">${v===null?'—':fmt(v)}</td>`;
      }).join('')}
      ${ctx.impFinal!==false?`<td class="final">${(()=>{const r=notaFinal(t,al.id,eu.id,discAtiva());return r.nota===null?'—':fmt(r.nota);})()}</td>`:''}
      ${ctx.impAss?'<td></td>':''}</tr>`).join('')}</tbody>
  </table>
  <div style="margin-top:26px;font-size:12px;color:var(--tinta-fraca)">
    ${calcDe(t.id,eu.id,discAtiva()).modo==='pesos'?'Nota final por valor fixo de cada avaliação.':'Nota final pela média das avaliações lançadas.'}
    Escala da nota final: 0 a ${fmt(calcDe(t.id,eu.id,discAtiva()).maxFinal)}.
  </div>`;
}

   como resgate manual, na mão do gerenciador.

function vNuvem(alvo){
  alvo.innerHTML=`
  <div class="cabeca"><div><h2>Sincronização</h2><div class="sub">Tudo o que você lança é gravado na caderneta da escola e aparece nos outros aparelhos.</div></div></div>
  ${painelNuvem(false)}
  <div class="painel">
    <h3>Como funciona</h3>
    <p class="desc">Não há nada para salvar manualmente.</p>
    <div class="aviso">
      Cada alteração sobe poucos segundos depois de você sair do campo, e o app confere a cada vinte segundos
      se algum colega lançou algo novo. Entrando pelo mesmo endereço em outro aparelho — inclusive no celular —
      você encontra a caderneta no ponto em que parou.
    </div>
    <div class="aviso ${nuvemLigada()?'bom':'erro'}">
      ${nuvemLigada()
        ? 'Este aparelho está ligado à caderneta da escola.'
        : 'Este aparelho ainda não está ligado. Peça ao gerenciador o link de configuração — sem ele, o que você lançar fica preso aqui.'}
    </div>
  </div>`;
  ligarPainelNuvem();
}

function exportarJSON(){
  const nome = 'caderneta-'+(DB.capa.instituicao||'escola').replace(/\s+/g,'-').toLowerCase()+'-'+new Date().toISOString().slice(0,10)+'.json';
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(DB,null,1)],{type:'application/json'}));
  a.download=nome; a.click(); URL.revokeObjectURL(a.href);
  toast('Cópia baixada.');
}
function importarJSON(){
  const i=document.createElement('input'); i.type='file'; i.accept='.json,application/json';
  i.onchange=()=>{
    const f=i.files[0]; if(!f) return;
    const fr=new FileReader();
    fr.onload=()=>{
      try{
        const j=JSON.parse(fr.result);
        if(!j.turmas||!j.avaliacoes) throw new Error('arquivo fora do formato');
        if(!confirm('Substituir a caderneta atual pelo conteúdo do arquivo? Isso também será enviado à nuvem.')) return;
        DB=Object.assign(vazioDB(), j); migrar(); salvar();
        if(nuvemLigada()){ SINC.enviados={}; sincronizar(true, true); }
        if(sessao){ render(); } else { telaAcesso(); }
        toast('Cópia restaurada.');
      }catch(e){ toast('Arquivo inválido: '+e.message); }
    };
    fr.readAsText(f);
  };
  i.click();
}

function ligaProfessores(){
  $$('[data-lib]').forEach(b=>b.onclick=()=>{
    const pr=profPorId(b.dataset.lib); pr.status='ativo'; pr.liberadoEm=Date.now();
    salvar(); renderGerente(); toast(`${pr.nome} já pode entrar.`);
  });
  $$('[data-rec]').forEach(b=>b.onclick=()=>{
    const pr=profPorId(b.dataset.rec);
    if(!confirm(`Recusar e apagar a solicitação de ${pr.nome}?`)) return;
    DB.professores=DB.professores.filter(x=>x.id!==pr.id); salvar(); renderGerente();
  });
  $('#gAdd').onclick=async()=>{
    const nome=$('#gNome').value.trim(), sen=$('#gSenha').value, discs=[];
    if(!nome) return toast('Informe o nome do professor.');
    if(DB.professores.some(x=>normal(x.nome)===normal(nome))) return toast('Já existe um cadastro com esse nome.');
    if(sen.length<4) return toast('A senha precisa de pelo menos 4 caracteres.');
    DB.professores.push({id:uid(), nome, disciplinas:discs, hash:await hash(sen), dica:'',
      status:'ativo', criadoEm:Date.now(), liberadoEm:Date.now()});
    salvar(); renderGerente(); toast('Professor cadastrado.');
  };
  $$('[data-gsenha]').forEach(b=>b.onclick=()=>{
    const pr=profPorId(b.dataset.gsenha);
    abrirModal(`<h3>Nova senha de ${esc(pr.nome)}</h3>
      <div style="display:grid;gap:12px">
        <div><label>Senha</label><input type="password" id="gs1"></div>
        <div class="acoes"><button class="btn" id="gsOk">Definir</button><button class="btn sec" data-fechar>Cancelar</button></div>
      </div>`);
    $('#gsOk').onclick=async()=>{
      const v=$('#gs1').value; if(v.length<4) return toast('Use pelo menos 4 caracteres.');
      pr.hash=await hash(v); pr.dica=''; salvar(); fecharModal(); toast('Senha definida.');
    };
  });
  $$('[data-gedit]').forEach(b=>b.onclick=()=>modalProfessor(profPorId(b.dataset.gedit)));
  $$('[data-gsusp]').forEach(b=>b.onclick=()=>{
    const pr=profPorId(b.dataset.gsusp);
    if(!confirm(`Suspender o acesso de ${pr.nome}?`)) return;
    pr.status='pendente'; pr.liberadoEm=null; salvar(); renderGerente();
  });
  $$('[data-gdel]').forEach(b=>b.onclick=()=>{
    const pr=profPorId(b.dataset.gdel);
    if(!confirm(`Excluir ${pr.nome}? As avaliações e notas dessa disciplina também serão apagadas.`)) return;
    avaliacoesDoProf(pr.id).forEach(a=>{
      Object.keys(DB.aplicacoes).forEach(k=>{ if(k.endsWith('::'+a.id)) delete DB.aplicacoes[k]; });
    });
    DB.avaliacoes=DB.avaliacoes.filter(a=>a.profId!==pr.id);
    Object.keys(DB.acessos).forEach(k=>{ if(partesAcesso(k).profId===pr.id) delete DB.acessos[k]; });
    Object.keys(DB.calculos).forEach(k=>{ if(k.endsWith('::'+pr.id)) delete DB.calculos[k]; });
    DB.professores=DB.professores.filter(x=>x.id!==pr.id);
    salvar(); renderGerente();
  });
  $('#gTrocar').onclick=async()=>{
    if(await hash($('#ga').value)!==DB.gerente.hash) return toast('Senha atual incorreta.');
    const n=$('#gn').value; if(n.length<4) return toast('Use pelo menos 4 caracteres.');
    DB.gerente.hash=await hash(n); salvar(); renderGerente(); toast('Senha trocada.');
  };
}

function atribuicoesDo(pr){
  return Object.keys(DB.acessos).filter(k=>partesAcesso(k).profId===pr.id).map(k=>{
    const a=partesAcesso(k);
    return {k, turma:DB.turmas.find(t=>t.id===a.turmaId), disc:a.disc, status:DB.acessos[k].status};
  }).filter(x=>x.turma).sort((x,y)=>ordTurma(x.turma,y.turma)||x.disc.localeCompare(y.disc,'pt-BR'));
}

function ligaAlunos(){

  const t=DB.turmas.find(x=>x.id===ctx.gTurma); if(!t) return;
  const add=nome=>{
    nome=nome.replace(/^\s*\d+\s*[-–.)°º]?\s*/,'').replace(/^[-•*]\s*/,'').replace(/\s+/g,' ').trim();
    if(!nome) return false;
    if(t.alunos.some(a=>normal(a.nome)===normal(nome))) return false;
    t.alunos.push({id:uid(), nome, senha:'', resetLiberado:false}); return true;
  };
  $('#gaAdd').onclick=()=>{ if(!add($('#gaNome').value)) return toast('Nome vazio ou já existente.');
    salvar(); renderGerente(); toast('Aluno adicionado.'); };
  $('#gaAddLista').onclick=()=>{
    let n=0; $('#gaLista').value.split(/\r?\n/).forEach(l=>{ if(add(l)) n++; });
    salvar(); renderGerente(); toast(n?`${n} aluno(s) adicionado(s).`:'Nenhum nome novo.');
  };
  $$('[data-garen]').forEach(b=>b.onclick=()=>{
    const a=t.alunos.find(x=>x.id===b.dataset.garen);
    const n=prompt('Nome completo:', a.nome); if(n&&n.trim()){ a.nome=n.trim(); salvar(); renderGerente(); }

  $$('[data-gadel]').forEach(b=>b.onclick=()=>{
    const a=t.alunos.find(x=>x.id===b.dataset.gadel);
    if(!confirm(`Excluir ${a.nome}? As notas dele em todas as disciplinas serão apagadas.`)) return;
    excluirAluno(t, a.id); salvar(); renderGerente();
  });
}
function excluirAluno(t, alunoId){

/* =======================================================================
   VISÃO DO ALUNO
   ======================================================================= */
function dadosAluno(t, al, profId, disc){
  const avs = avaliacoesDaTurma(t.id, profId, disc).filter(a=>apl(t.id,a.id).visivel);
  const calc = calcDe(t.id, profId, disc);
  const itens = avs.map(a=>{
    const n=notaAval(a,t.id,al.id);
    return {a, n, pct:(n===null||num(a.max,0)<=0)?null:n/num(a.max,1), valor:num((calc.pesos||{})[a.id],0)};
  });
  const lancadas = itens.filter(i=>i.pct!==null);
  let final=null;
  if(lancadas.length){
    final = calc.modo==='pesos'
      ? lancadas.reduce((s,i)=>s+i.pct*i.valor,0)
      : (lancadas.reduce((s,i)=>s+i.pct,0)/lancadas.length)*num(calc.maxFinal,10);
  }
  return {avs, itens, lancadas, calc, final};
}

function renderAluno(){
  const t=DB.turmas.find(x=>x.id===sessao.turmaId);
  const al=t?t.alunos.find(x=>x.id===sessao.alunoId):null;
  if(!t||!al){ sessao=null; return telaAcesso(); }
  const c=DB.capa;
  const discs = disciplinasDaTurma(t.id);
  const par = discs.find(p=>p.chave===ctx.alunoProf) || null;
  const D = par ? dadosAluno(t, al, par.prof.id, par.disc) : null;
  const aberta = D ? D.avs.find(a=>a.id===ctx.alunoAval) : null;

  $('#tela').innerHTML=`
  <div class="boletim">
    <div class="cabeca-b">
      <h2>${esc(al.nome)}</h2>
